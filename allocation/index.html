<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allocation</title>
    <meta name="description" content="Split your bitcoin holdings into separate stacks and see the percentage of each.">
    <link rel="canonical" href="https://pricetools.space/allocation">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Allocation">
    <meta property="og:description" content="Split your bitcoin holdings into separate stacks and see the percentage of each.">
    <meta property="og:url" content="https://pricetools.space/allocation">
    <meta property="og:image" content="https://pricetools.space/assets/images/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Allocation">
    <meta name="twitter:description" content="Split your bitcoin holdings into separate stacks and see the percentage of each.">
    <meta name="twitter:image" content="https://pricetools.space/assets/images/preview.png">
    <link rel="icon" type="image/png" href="/assets/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon-files/site.webmanifest">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100dvh;
            background: #000;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .content {
            width: 100%;
            max-width: 420px;
            margin-block: auto;
            padding: 0 1rem 2rem;
        }

        .converter {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .input-container {
            position: relative;
        }

        input {
            width: 100%;
            background: #000;
            color: #fff;
            border: 1px solid #555;
            border-radius: 10px;
            font-size: 24px;
            padding: 20px 12px;
            -webkit-appearance: none;
            appearance: none;
        }

        input:hover, input:focus {
            background: #111;
            outline: none;
        }

        .prefix {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            pointer-events: none;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .row > div {
            min-width: 0;
        }

        .amt-container input {
            padding-left: 32px;
        }

        .pct-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            border: 1px solid #555;
            border-radius: 10px;
            font-size: 24px;
            padding: 20px 36px 20px 12px;
            color: #fff;
        }

        .pct-container::after {
            content: '%';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .result-wrapper {
            width: 100%;
            text-align: center;
        }

        #total {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="converter">
            <div class="row">
                <div class="input-container amt-container">
                    <span class="prefix">₿</span>
                    <input type="tel" inputmode="decimal" class="alloc-amt" placeholder="0">
                </div>
                <div class="pct-container"><span class="alloc-pct">0</span></div>
            </div>
            <div class="row">
                <div class="input-container amt-container">
                    <span class="prefix">₿</span>
                    <input type="tel" inputmode="decimal" class="alloc-amt" placeholder="0">
                </div>
                <div class="pct-container"><span class="alloc-pct">0</span></div>
            </div>
            <div class="row">
                <div class="input-container amt-container">
                    <span class="prefix">₿</span>
                    <input type="tel" inputmode="decimal" class="alloc-amt" placeholder="0">
                </div>
                <div class="pct-container"><span class="alloc-pct">0</span></div>
            </div>
            <div class="row">
                <div class="input-container amt-container">
                    <span class="prefix">₿</span>
                    <input type="tel" inputmode="decimal" class="alloc-amt" placeholder="0">
                </div>
                <div class="pct-container"><span class="alloc-pct">0</span></div>
            </div>
            <div class="result-wrapper">
                <div id="total"></div>
            </div>
        </div>
    </div>
    <script>
        const amtIns = document.querySelectorAll('.alloc-amt');
        const pctEls = document.querySelectorAll('.alloc-pct');
        const totalEl = document.getElementById('total');

        function fmtPct(n) {
            const rounded = Math.round(n * 10) / 10;
            let str = rounded.toFixed(1);
            if (str.endsWith('.0')) str = str.slice(0, -2);
            return str;
        }

        function fmtBtc(n) {
            return (Math.round(n * 1e8) / 1e8).toLocaleString('en-US', { maximumFractionDigits: 8 });
        }

        function calculate() {
            const amts = Array.from(amtIns).map(el => parseFloat(el.value.replace(/,/g, '')) || 0);
            const total = amts.reduce((a, b) => a + b, 0);
            const hasEntry = Array.from(amtIns).some(el => el.value !== '');
            totalEl.textContent = hasEntry ? 'Total: ₿' + fmtBtc(total) : '';
            amts.forEach((amt, i) => {
                const pct = total > 0 ? (amt / total) * 100 : 0;
                pctEls[i].textContent = fmtPct(pct);
            });
        }

        function formatAmountInput(el) {
            el.addEventListener('input', () => {
                let v = el.value.replace(/[^0-9.]/g, '');
                if (v.includes('.')) {
                    const parts = v.split('.');
                    if (parts[1]) parts[1] = parts[1].slice(0, 8);
                    v = parts.join('.');
                }
                const [int, dec] = v.split('.');
                const formatted = int ? Number(int).toLocaleString('en-US') : '';
                el.value = dec !== undefined ? `${formatted}.${dec}` : formatted;
                calculate();
            });
        }

        amtIns.forEach(formatAmountInput);
    </script>
    <script src="/menu/menu.js"></script>
</body>
</html>
