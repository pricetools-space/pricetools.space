<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin by Date Range</title>
    <link rel="icon" type="image/png" href="/-/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/-/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/-/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/-/favicon-files/site.webmanifest">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{min-height:100dvh;background:#000;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
        .content{width:100%;max-width:360px;margin-block:auto}
        .converter{display:flex;flex-direction:column;gap:10px;width:100%}
        .date-group{width:100%}
        .date-container{display:flex;gap:5px;width:100%}
        .date-container select{flex:1;text-align:center;text-align-last:center}
        .field-container{position:relative;width:100%}
        select,input{width:100%;background:#000;color:#fff;border:1px solid #555;border-radius:10px;font-size:24px;padding:20px 12px;-webkit-appearance:none;appearance:none}
        .field-container input{padding-left:32px;padding-right:72px}
        select:hover,select:focus,input:hover,input:focus{background:#111;outline:none}
        input::-webkit-inner-spin-button{-webkit-appearance:none}
        .prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:24px;pointer-events:none;opacity:0;transition:opacity .2s}
        .has-value .prefix{opacity:1}
        .suffix{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:24px;pointer-events:none;transition:opacity .2s;white-space:nowrap}
        .year-label,.max-label,.at-max-label{opacity:0;color:#888}
        .has-year:not(.at-max) .year-label{opacity:0.5}
        .at-max .max-label,.at-max .at-max-label{opacity:0.5}
        .menu{font-size:3rem;font-weight:100;color:#666;margin-block-end:2vh;text-decoration:none;transition:color .5s}
        .menu:hover{color:#fff}
    </style>
</head>
<body>
    <div class="content">
        <div class="converter">
            <div class="date-group">
                <div class="date-container">
                    <select id="startDay"><option value="" disabled selected>Day</option></select>
                    <select id="startMonth">
                        <option value="" disabled selected>Month</option>
                        <option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option>
                        <option value="04">Apr</option><option value="05">May</option><option value="06">Jun</option>
                        <option value="07">Jul</option><option value="08">Aug</option><option value="09">Sep</option>
                        <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
                    </select>
                    <select id="startYear"><option value="" disabled selected>Year</option></select>
                </div>
            </div>
            <div class="date-group">
                <div class="date-container">
                    <select id="endDay"><option value="" disabled selected>Day</option></select>
                    <select id="endMonth">
                        <option value="" disabled selected>Month</option>
                        <option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option>
                        <option value="04">Apr</option><option value="05">May</option><option value="06">Jun</option>
                        <option value="07">Jul</option><option value="08">Aug</option><option value="09">Sep</option>
                        <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
                    </select>
                    <select id="endYear"><option value="" disabled selected>Year</option></select>
                </div>
            </div>
            <div class="field-container" id="thenContainer">
                <span class="prefix">$</span>
                <input type="tel" inputmode="decimal" id="usdAmount" placeholder="USD amount">
                <span class="suffix max-label" id="thenMaxLabel"></span>
                <span class="suffix year-label" id="thenYear"></span>
            </div>
            <div class="field-container" id="nowContainer">
                <span class="prefix">$</span>
                <input type="text" id="nowResult" placeholder="USD amount" readonly>
                <span class="suffix at-max-label" id="nowMaxLabel"></span>
                <span class="suffix year-label" id="nowYear"></span>
            </div>
        </div>
    </div>
    <a data-open-drawer class="menu">≡</a>
    <script src="/menu/drawer.js"></script>
    <script>
        const TOTAL_SUPPLY = 21000000;
        let priceMap = {};
        let currentPriceUSD = 0;
        const els = {
            startDay: document.getElementById('startDay'),
            startMonth: document.getElementById('startMonth'),
            startYear: document.getElementById('startYear'),
            endDay: document.getElementById('endDay'),
            endMonth: document.getElementById('endMonth'),
            endYear: document.getElementById('endYear'),
            usd: document.getElementById('usdAmount'),
            thenContainer: document.getElementById('thenContainer'),
            thenMaxLabel: document.getElementById('thenMaxLabel'),
            thenYear: document.getElementById('thenYear'),
            nowResult: document.getElementById('nowResult'),
            nowContainer: document.getElementById('nowContainer'),
            nowMaxLabel: document.getElementById('nowMaxLabel'),
            nowYear: document.getElementById('nowYear')
        };
        Promise.all([
            fetch('/-/data/bitcoin-data.csv').then(r=>r.text()),
            fetch('/-/data/bitcoin-current-data.csv').then(r=>r.text())
        ]).then(([historyData, currentData]) => {
            historyData.split('\n').forEach(l=>{
                const [d,p]=l.split(','); if(!d||!p) return;
                const [m,day,y]=d.trim().split('/');
                const year = y.length===2?'20'+y:y;
                const key = `${year}-${m.padStart(2,'0')}-${day.padStart(2,'0')}`;
                const price = parseFloat(p);
                if(!isNaN(price)) priceMap[key] = price;
            });
            currentPriceUSD = parseFloat(currentData.split('\n')[0]?.split(',')[1]) || 0;
            update();
        });
        for(let i=1;i<=31;i++){
            ['startDay','endDay'].forEach(id=>{
                const o=document.createElement('option');
                o.value=o.text=i.toString().padStart(2,'0');
                document.getElementById(id).appendChild(o);
            });
        }
        for(let i=2011;i<=new Date().getFullYear();i++){
            ['startYear','endYear'].forEach(id=>{
                const o=document.createElement('option');
                o.value=o.text=i;
                document.getElementById(id).appendChild(o);
            });
        }
        function fmt(n){
            if(n>=1e12) return (n/1e12).toFixed(1)+' Trillion';
            if(n>=1e9) return (n/1e9).toFixed(1)+' Billion';
            return n.toLocaleString('en-US',{maximumFractionDigits:0});
        }
        function getPrice(dateKey){
            const today = new Date();
            const [year, month, day] = dateKey.split('-');
            const selectedDate = new Date(year, month - 1, day);
            if(selectedDate > today) return null;
            return priceMap[dateKey] || currentPriceUSD;
        }
        function getMaxUSD(){
            const startKey = `${els.startYear.value}-${els.startMonth.value}-${els.startDay.value}`;
            const startPrice = getPrice(startKey);
            return startPrice ? startPrice * TOTAL_SUPPLY : Infinity;
        }
        function enforceCap(){
            const num = parseFloat(els.usd.value.replace(/,/g,'')) || 0;
            const max = getMaxUSD();
            const atMax = num >= max && max !== Infinity;
            if(num > max && max !== Infinity){
                els.usd.value = Math.floor(max).toLocaleString('en-US');
            }
            els.thenContainer.classList.toggle('at-max', atMax);
            els.nowContainer.classList.toggle('at-max', atMax);
        }
        function update(){
            const hasStart = els.startYear.value && els.startMonth.value && els.startDay.value;
            const hasEnd = els.endYear.value && els.endMonth.value && els.endDay.value;
            const startKey = hasStart ? `${els.startYear.value}-${els.startMonth.value}-${els.startDay.value}` : '';
            const endKey = hasEnd ? `${els.endYear.value}-${els.endMonth.value}-${els.endDay.value}` : '';
            const startPrice = hasStart ? getPrice(startKey) : 0;
            const endPrice = hasEnd ? getPrice(endKey) : currentPriceUSD;
            const hasDates = hasStart && startPrice > 0;
            const startYearVal = hasStart ? els.startYear.value : '';
            const endYearVal = hasEnd ? els.endYear.value : '';
            els.thenYear.textContent = startYearVal;
            els.nowYear.textContent = endYearVal;
            els.thenContainer.classList.toggle('has-year', startYearVal !== '');
            els.nowContainer.classList.toggle('has-year', endYearVal !== '');
            els.thenMaxLabel.textContent = startYearVal ? `max ${startYearVal}` : 'max';
            els.nowMaxLabel.textContent = endYearVal ? `max ${endYearVal}` : 'max';
            enforceCap();
            const usdRaw = els.usd.value.replace(/,/g,'');
            const usd = parseFloat(usdRaw) || 0;
            const hasUsd = usd > 0;
            els.thenContainer.classList.toggle('has-value', hasUsd);
            const hasResult = hasUsd && hasDates && startPrice !== null && endPrice !== null;
            els.nowContainer.classList.toggle('has-value', hasResult);
            if(!hasResult){
                if(hasUsd && hasDates && (startPrice === null || endPrice === null)){
                    els.nowResult.value = 'Unknown price';
                } else {
                    els.nowResult.value = '';
                }
                return;
            }
            const btc = usd / startPrice;
            const nowValue = btc * endPrice;
            els.nowResult.value = fmt(nowValue);
        }
        els.usd.addEventListener('input',function(){
            let v = this.value.replace(/[^0-9]/g,'');
            if(v) v = Number(v).toLocaleString('en-US');
            this.value = v;
            update();
        });
        [els.startDay,els.startMonth,els.startYear,els.endDay,els.endMonth,els.endYear].forEach(el=>el.addEventListener('change',update));
    </script>
</body>
</html>
