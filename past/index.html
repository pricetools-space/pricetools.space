<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Price Tool</title>
    <meta name="description" content="Browse historical Bitcoin prices and see how an amount would have grown over time.">
    <link rel="canonical" href="https://pricetools.space/past">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Past Price Tool">
    <meta property="og:description" content="Browse historical Bitcoin prices and see how an amount would have grown over time.">
    <meta property="og:url" content="https://pricetools.space/past">
    <meta property="og:image" content="https://pricetools.space/assets/images/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Past Price Tool">
    <meta name="twitter:description" content="Browse historical Bitcoin prices and see how an amount would have grown over time.">
    <meta name="twitter:image" content="https://pricetools.space/assets/images/preview.png">
    <link rel="icon" type="image/png" href="/assets/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon-files/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh; background: #000; color: #fff;
            font-family: system-ui, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
        }
        .content { width: 100%; max-width: 360px; margin-block: auto; }
        h1 { font-size: 32px; margin-bottom: 24px; text-align: center; }
        .converter { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .date-container { display: flex; gap: 5px; width: 100%; }
        .date-container select { flex: 1; text-align: center; text-align-last: center; }
        .date-container select option { text-align: left; }
        .input-container { position: relative; width: 100%; }
        select, input, button {
            width: 100%; background: #000; color: #fff;
            border: 1px solid #555; border-radius: 10px;
            font-size: 24px; padding: 20px 12px;
            -webkit-appearance: none; appearance: none;
        }
        .input-container input { padding-left: 32px; padding-right: 72px; }
        select:hover, select:focus, input:hover, input:focus, button:hover, button:focus {
            background: #111; outline: none;
        }
        input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .usd-container::before {
            content: '$'; position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%); font-size: 24px;
        }
        .usd-container::after {
            content: 'max'; position: absolute; right: 18px; top: 50%;
            transform: translateY(-50%); font-size: 24px;
            opacity: 0; transition: opacity .2s;
        }
        .usd-container.at-max::after { opacity: 1; }
        .result-wrapper { width: 100%; min-height: 140px; text-align: center; }
        #result {
            margin-top: 20px; font-size: 20px; font-weight: bold;
            color: #fff; min-height: 120px;
            display: flex; align-items: center; justify-content: center;
            line-height: 1.4;
        }
        select option:disabled { display: none; }
    </style>
</head>
<body>
    <div class="content">
        <div class="converter">
            <div class="date-container">
                <select id="day"><option value="" disabled selected>Day</option></select>
                <select id="month">
                    <option value="" disabled selected>Month</option>
                    <option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option>
                    <option value="04">Apr</option><option value="05">May</option><option value="06">Jun</option>
                    <option value="07">Jul</option><option value="08">Aug</option><option value="09">Sep</option>
                    <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
                </select>
                <select id="year"><option value="" disabled selected>Year</option></select>
            </div>
            <div class="input-container usd-container" id="usdContainer">
                <input type="tel" inputmode="decimal" id="usdAmount" placeholder="USD">
            </div>
            <button onclick="getPrice()">What's it worth now?</button>
            <div class="result-wrapper">
                <div id="result"></div>
            </div>
        </div>
    </div>
    <script src="/menu/menu.js"></script>
    <script>
        let priceMap = null;
        let currentPriceUSD = 0;
        let selectedPriceUSD = 0;
        const TOTAL_SUPPLY = 21000000;
        const usdContainer = document.getElementById('usdContainer');

        fetch('/assets/data/bitcoin-data.csv').then(r=>r.text()).then(t=>{
            priceMap = {};
            t.split('\n').forEach(l=>{
                const [d,p]=l.split(','); if(!d||!p) return;
                const [m,day,y]=d.trim().split('/');
                const year = y.length===2?'20'+y:y;
                const key = `${year}-${m.padStart(2,'0')}-${day.padStart(2,'0')}`;
                const price = parseFloat(p);
                if(!isNaN(price)) priceMap[key] = price;
            });
        });

        fetch('/assets/data/bitcoin-current-data.csv').then(r=>r.text()).then(t=>{
            const price = parseFloat(t.split('\n')[0]?.split(',')[1]);
            if(!isNaN(price) && price>0) currentPriceUSD = price;
        });

        function getMaxUSD(){ return selectedPriceUSD ? selectedPriceUSD*TOTAL_SUPPLY*0.999999 : Infinity; }

        function enforceCap(){
            const input = document.getElementById('usdAmount');
            const num = parseFloat(input.value.replace(/,/g,'')) || 0;
            const max = getMaxUSD();
            const atMax = num >= max && max !== Infinity;
            if(num > max && max !== Infinity){
                input.value = max.toLocaleString('en-US',{maximumFractionDigits:2});
            }
            usdContainer.classList.toggle('at-max', atMax);
        }

        function updatePriceFromDate(){
            const y=document.getElementById('year').value;
            const m=document.getElementById('month').value;
            const d=document.getElementById('day').value;
            if(!y||!m||!d){
                selectedPriceUSD = 0;
                enforceCap();
                return;
            }
            const selectedDate = new Date(`${y}-${m}-${d}`);
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate()-1);
            if(selectedDate > yesterday){
                selectedPriceUSD = currentPriceUSD;
            }else{
                const key = `${y}-${m}-${d}`;
                selectedPriceUSD = priceMap[key] || currentPriceUSD;
            }
            enforceCap();
        }

        document.getElementById('usdAmount').addEventListener('input',function(){
            let v = this.value.replace(/[^0-9.]/g,'');
            if(v.split('.').length>2) v = v.replace(/\.(?=.*\.)/g,'');
            if(v.includes('.')){
                const [i,dec] = v.split('.');
                if(dec && dec.length>2) v = i+'.'+dec.slice(0,2);
            }
            const [int] = v.split('.');
            if(int) v = Number(int).toLocaleString('en-US') + (v.includes('.')?'.'+v.split('.')[1]:'');
            this.value = v;
            enforceCap();
        });

        for(let i=1;i<=31;i++){
            const o=document.createElement('option');
            o.value=o.text=i.toString().padStart(2,'0');
            document.getElementById('day').appendChild(o);
        }
        for(let i=2011;i<=new Date().getFullYear();i++){
            const o=document.createElement('option');
            o.value=o.text=i;
            document.getElementById('year').appendChild(o);
        }

        ['day','month','year'].forEach(id=>document.getElementById(id).addEventListener('change',updatePriceFromDate));

        const fmtBig = n=>{
            if(n>=1e21) return '$' + (Math.round((n/1e21)*10)/10) + ' sextillion';
            if(n>=1e18) return '$' + (Math.round((n/1e18)*10)/10) + ' quintillion';
            if(n>=1e15) return '$' + (Math.round((n/1e15)*10)/10) + ' quadrillion';
            if(n>=1e12) return '$' + (Math.round((n/1e12)*10)/10) + ' trillion';
            if(n>=1e9)  return '$' + (Math.round((n/1e9)*10)/10) + ' billion';
            if(n>=1e6)  return '$' + (Math.round((n/1e6)*10)/10) + ' million';
            const str = n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            return '$' + str.replace(/\.00$/, '');
        };

        const fmtDate = (m,d,y)=>{
            const months=['','January','February','March','April','May','June','July','August','September','October','November','December'];
            const day=parseInt(d), s=day===1||day===21||day===31?'st':day===2||day===22?'nd':day===3||day===23?'rd':'th';
            return `${months[parseInt(m)]} ${day}${s}, ${y}`;
        };

        function animate(start, end, el, usd, dateStr){
            const dur=1200, step=50, inc=(end-start)/(dur/step);
            let cur = start;
            const update = () => {
                const usdStr = fmtBig(usd);
                const nowStr = fmtBig(cur);
                el.textContent = usdStr + ' of Bitcoin on ' + dateStr + ' is worth ' + nowStr + ' today.';
            };
            const id = setInterval(()=>{
                cur += inc;
                if((inc>0&&cur>=end)||(inc<0&&cur<=end)){ 
                    cur = end; 
                    clearInterval(id); 
                }
                update();
            },step);
            update();
        }

        window.getPrice = ()=>{
            const y=document.getElementById('year').value;
            const m=document.getElementById('month').value;
            const d=document.getElementById('day').value;
            const raw=document.getElementById('usdAmount').value.trim();
            const res=document.getElementById('result');
            if(!y||!m||!d||!raw){
                res.textContent='Select a date and enter USD amount';
                return;
            }
            const selected = new Date(`${y}-${m}-${d}`);
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate()-1);
            if(selected > yesterday){
                res.textContent='Please enter a date on or before yesterday';
                return;
            }
            const usd = parseFloat(raw.replace(/,/g,''));
            const btc = usd / (priceMap[`${y}-${m}-${d}`] || currentPriceUSD);
            const now = btc * currentPriceUSD;
            const dateStr = fmtDate(m,d,y);
            animate(usd, now, res, usd, dateStr);
        };
    </script>
</body>
</html>
