<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin By Date</title>
    <meta name="description" content="Free and open source Bitcoin price tools: historical data, USD to BTC converter, and price projections.">
    <meta name="keywords" content="bitcoin price, btc usd converter, bitcoin history, bitcoin prediction, bitcoin tools">
    <meta property="og:title" content="Price Tools - Bitcoin Price History, Converter & Projections">
    <meta property="og:description" content="Instant Bitcoin price tools: view history, convert USD to BTC, and see projections.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pricetools.space">
    <meta property="og:image" content="/-/images/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Price Tools - Bitcoin Price History, Converter & Projections">
    <meta name="twitter:description" content="Instant Bitcoin price tools: view history, convert USD to BTC, and see projections.">
    <meta name="twitter:image" content="/-/images/preview.png">
    <link rel="icon" type="image/png" href="/-/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/-/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/-/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/-/favicon-files/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            background: #000;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .content {
            width: 100%;
            max-width: 360px;
            margin-block: auto;
            padding: 0 1rem;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 24px;
        }
        .converter {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .date-container {
            display: flex;
            gap: 5px;
            width: 100%;
        }
        .date-container select {
            flex: 1;
            text-align: center;
            text-align-last: center;
        }
        .input-container {
            position: relative;
            width: 100%;
        }
        select,
        input {
            width: 100%;
            background: #000;
            color: #fff;
            border: 1px solid #555;
            border-radius: 10px;
            font-size: 24px;
            padding: 20px 12px;
            -webkit-appearance: none;
            appearance: none;
        }
        .usd-container input,
        .btc-container input,
        .sats-container input {
            padding-left: 32px;
        }
        .sats-container input {
            padding-right: 72px;
        }
        select:hover, select:focus,
        input:hover, input:focus {
            background: #111;
            outline: none;
        }
        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }
        .usd-container::before { content: '$'; }
        .btc-container::before { content: '₿'; }
        .usd-container::before,
        .btc-container::before {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
        }
        .sats-container::before, .sats-cost::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 51%;
            transform: translateY(-50%);
            width: 1.2em;
            height: 1.2em;
            background: url('/-/images/sats.svg') center/contain no-repeat;
            pointer-events: none;
        }
        .sats-container::after {
            content: 'sats';
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            opacity: 0;
            transition: opacity .2s;
        }
        .sats-container.filled::after {
            opacity: 1;
        }
        .menu {
            font-size: 3rem;
            font-weight: 100;
            color: #666;
            margin-block-end: 2vh;
            text-decoration: none;
            transition: color 0.5s ease;
        }
        .menu:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="content">
        <div class="converter">
            <div class="date-container">
                <select id="day"></select>
                <select id="month"></select>
                <select id="year"></select>
            </div>
            <div class="input-container usd-container">
                <input type="tel" inputmode="decimal" id="usd" placeholder="USD">
            </div>
            <div class="input-container btc-container">
                <input type="tel" inputmode="decimal" id="btc" placeholder="BTC">
            </div>
            <div class="input-container sats-container">
                <input type="tel" inputmode="numeric" id="sats" placeholder="SATS">
            </div>
        </div>
    </div>
    <a data-open-drawer class="menu">≡</a>
    <script src="/menu/drawer.js"></script>
    <script>
        const btcToSats = 100000000;
        let priceMap = null;
        let currentRate = null;
        let lastInput = null;
        async function loadCSV() {
            if (priceMap) return;
            try {
                const res = await fetch('/-/data/bitcoin-data.csv');
                const text = await res.text();
                const lines = text.split('\n').filter(l => l.trim());
                priceMap = {};
                lines.forEach(line => {
                    const [rawDate, priceStr] = line.split(',');
                    if (!rawDate || !priceStr) return;
                    const [m, d, y] = rawDate.trim().split('/');
                    const year = y.length === 2 ? '20' + y : y;
                    const month = m.padStart(2, '0');
                    const day = d.padStart(2, '0');
                    const key = `${year}-${month}-${day}`;
                    const price = parseFloat(priceStr.trim());
                    if (!isNaN(price)) priceMap[key] = price;
                });
            } catch (e) {
                console.error('CSV load failed:', e);
            }
        }
        async function loadCurrentCSV() {
            try {
                const res = await fetch('/-/data/bitcoin-current-data.csv');
                const text = await res.text();
                const lines = text.split('\n').filter(l => l.trim());
                if (lines.length > 0) {
                    const price = parseFloat(lines[0].split(',')[1].trim());
                    if (!isNaN(price) && price > 0) currentRate = 1 / price;
                }
            } catch (e) {
                console.error(e);
            }
        }
        function getRate(y, m, d) {
            const today = new Date();
            const isToday = y == today.getFullYear() && parseInt(m) == today.getMonth() + 1 && parseInt(d) == today.getDate();
            if (isToday) return currentRate;
            const key = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
            const price = priceMap?.[key];
            return price > 0 ? 1 / price : currentRate;
        }
        function populateDateSelectors() {
            const dayEl = document.getElementById('day');
            const monthEl = document.getElementById('month');
            const yearEl = document.getElementById('year');
            for (let i = 1; i <= 31; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i.toString().padStart(2, '0');
                dayEl.appendChild(opt);
            }
            ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].forEach((name, i) => {
                const opt = document.createElement('option');
                opt.value = i + 1;
                opt.textContent = name;
                monthEl.appendChild(opt);
            });
            const thisYear = new Date().getFullYear();
            for (let y = 2011; y <= thisYear; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                yearEl.appendChild(opt);
            }
            const today = new Date();
            dayEl.value = today.getDate();
            monthEl.value = today.getMonth() + 1;
            yearEl.value = thisYear;
        }
        function restrictInput(el, maxDecimals = 8) {
            el.addEventListener('input', () => {
                let v = el.value.replace(/[^0-9.]/g, '');
                if (v.includes('.') && maxDecimals > 0) {
                    const [int, dec] = v.split('.');
                    if (dec && dec.length > maxDecimals) v = int + '.' + dec.slice(0, maxDecimals);
                } else if (maxDecimals === 0) {
                    v = v.replace(/\./g, '');
                }
                const [intPart, decPart] = v.split('.');
                const formatted = intPart ? Number(intPart).toLocaleString('en-US') : '';
                el.value = decPart !== undefined ? `${formatted}.${decPart}` : formatted;
            });
        }
        const usdIn = document.getElementById('usd');
        const btcIn = document.getElementById('btc');
        const satsIn = document.getElementById('sats');
        const satsContainer = satsIn.parentElement;
        restrictInput(usdIn, 2);
        restrictInput(btcIn, 8);
        restrictInput(satsIn, 0);
        satsIn.addEventListener('input', () => {
            satsContainer.classList.toggle('filled', satsIn.value.length > 0);
        });
        async function updateConversions() {
            if (!priceMap || currentRate === null) return;
            const y = document.getElementById('year').value;
            const m = document.getElementById('month').value.padStart(2, '0');
            const d = document.getElementById('day').value.padStart(2, '0');
            if (!y || !m || !d) return;
            const selectedDate = new Date(y, m - 1, d);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            if (selectedDate > today || selectedDate.getDate() != d) {
                usdIn.disabled = btcIn.disabled = satsIn.disabled = true;
                return;
            }
            usdIn.disabled = btcIn.disabled = satsIn.disabled = false;
            const rate = getRate(y, m, d);
            const active = document.activeElement;
            const isDateChange = active && ['day','month','year'].includes(active.id);
            const btcVal = parseFloat(btcIn.value.replace(/,/g, '')) || 0;
            const usdVal = parseFloat(usdIn.value.replace(/,/g, '')) || 0;
            const satsVal = BigInt(satsIn.value.replace(/,/g, '') || '0');
            if (isDateChange && lastInput) {
                if (lastInput === 'usd' && usdVal > 0) {
                    const btc = usdVal * rate;
                    btcIn.value = btc.toFixed(8).replace(/0+$/, '').replace(/\.$/, '');
                    satsIn.value = Math.floor(btc * btcToSats).toLocaleString('en-US');
                    satsContainer.classList.add('filled');
                } else if (lastInput === 'btc' && btcVal > 0) {
                    usdIn.value = Number(btcVal / rate).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    satsIn.value = Math.floor(btcVal * btcToSats).toLocaleString('en-US');
                    satsContainer.classList.add('filled');
                } else if (lastInput === 'sats' && satsVal > 0n) {
                    const btc = Number(satsVal) / btcToSats;
                    btcIn.value = btc.toFixed(8).replace(/0+$/, '').replace(/\.$/, '');
                    usdIn.value = Number(btc / rate).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    satsContainer.classList.add('filled');
                }
                return;
            }
            if (active === usdIn || !active.closest('.input-container')) {
                if (usdVal > 0) {
                    const btc = usdVal * rate;
                    btcIn.value = btc.toFixed(8).replace(/0+$/, '').replace(/\.$/, '');
                    satsIn.value = Math.floor(btc * btcToSats).toLocaleString('en-US');
                    satsContainer.classList.add('filled');
                } else {
                    btcIn.value = '';
                    satsIn.value = '';
                    satsContainer.classList.remove('filled');
                }
            } else if (active === btcIn) {
                if (btcVal > 0) {
                    usdIn.value = Number(btcVal / rate).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    satsIn.value = Math.floor(btcVal * btcToSats).toLocaleString('en-US');
                    satsContainer.classList.add('filled');
                } else {
                    usdIn.value = '';
                    satsIn.value = '';
                    satsContainer.classList.remove('filled');
                }
            } else if (active === satsIn) {
                if (satsVal > 0n) {
                    const btc = Number(satsVal) / btcToSats;
                    btcIn.value = btc.toFixed(8).replace(/0+$/, '').replace(/\.$/, '');
                    usdIn.value = Number(btc / rate).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    satsContainer.classList.add('filled');
                } else {
                    usdIn.value = '';
                    btcIn.value = '';
                    satsContainer.classList.remove('filled');
                }
            }
        }
        usdIn.addEventListener('input', () => { lastInput = 'usd'; setTimeout(updateConversions, 0); });
        btcIn.addEventListener('input', () => { lastInput = 'btc'; setTimeout(updateConversions, 0); });
        satsIn.addEventListener('input', () => { lastInput = 'sats'; setTimeout(updateConversions, 0); });
        ['day', 'month', 'year'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => setTimeout(updateConversions, 0));
        });
        populateDateSelectors();
        Promise.all([loadCSV(), loadCurrentCSV()]).then(() => updateConversions());
    </script>
</body>
</html>
