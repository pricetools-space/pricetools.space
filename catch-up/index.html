<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch Up Cost</title>
    <link rel="icon" type="image/png" href="/-/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/-/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/-/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/-/favicon-files/site.webmanifest">
    <meta property="og:title" content="Catch Up Cost Tool - Current Bitcoin Equivalent">
    <meta property="og:description" content="Calculate how much USD to spend today to match Bitcoin bought on a selected date.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pricetools.space/catchup">
    <meta property="og:image" content="/-/images/preview-catchup.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            background: #000;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .content { width: 100%; max-width: 360px; margin-block: auto; }
        h1 {
            font-size: 32px;
            margin-bottom: 24px;
            text-align: center;
        }
        .converter {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .date-container {
            display: flex;
            gap: 5px;
            width: 100%;
        }
        .date-container select {
            flex: 1;
            text-align: center;
            text-align-last: center;
        }
        .date-container select option {
            text-align: left;
        }
        .input-container {
            position: relative;
            width: 100%;
        }
        select, input, button {
            width: 100%;
            background: #000;
            color: #fff;
            border: 1px solid #555;
            border-radius: 10px;
            font-size: 24px;
            padding: 20px 12px;
            -webkit-appearance: none;
            appearance: none;
        }
        .input-container input {
            padding-left: 32px;
            padding-right: 72px;
        }
        select:hover, select:focus,
        input:hover, input:focus,
        button:hover, button:focus {
            background: #111;
            outline: none;
        }
        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }
        .usd-container::before {
            content: '$';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
        }
        .usd-container::after {
            content: 'max';
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            opacity: 0;
            transition: opacity .2s;
        }
        .usd-container.at-max::after {
            opacity: 1;
        }
        button {
            cursor: pointer;
        }
        .result-wrapper {
            width: 100%;
            min-height: 140px;
            text-align: center;
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu {
            font-size: 3rem;
            font-weight: 100;
            color: #666;
            margin-block-end: 2vh;
            text-decoration: none;
            transition: color 0.5s ease;
        }
        .menu:hover { color: #fff; }
        select option:disabled {
            display: none;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="converter">
            <div class="date-container">
                <select id="day" required>
                    <option value="" disabled selected>Day</option>
                </select>
                <select id="month" required>
                    <option value="" disabled selected>Month</option>
                    <option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option>
                    <option value="04">Apr</option><option value="05">May</option><option value="06">Jun</option>
                    <option value="07">Jul</option><option value="08">Aug</option><option value="09">Sep</option>
                    <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
                </select>
                <select id="year" required>
                    <option value="" disabled selected>Year</option>
                </select>
            </div>
            <div class="input-container usd-container" id="usdContainer">
                <input type="tel" inputmode="decimal" id="usdAmount" placeholder="Value on selected date">
            </div>
            <button onclick="getPrice()">Cost to catch up</button>
            <div class="result-wrapper">
                <div id="result"></div>
            </div>
        </div>
    </div>
    <a data-open-drawer class="menu">≡</a>
    <script src="/menu/drawer.js"></script>
    <script>
        let priceMap = null;
        let currentRate = 0.000016;
        let latestCsvPrice = null;
        let selectedPriceUSD = 0;
        const TOTAL_SUPPLY = 21000000;
        const usdContainer = document.getElementById('usdContainer');
        async function loadCSV() {
            if (priceMap) return;
            try {
                const res = await fetch('/-/data/bitcoin-data.csv');
                const text = await res.text();
                const lines = text.split('\n').filter(l => l.trim());
                priceMap = {};
                let latest = 0;
                lines.forEach((l, i) => {
                    const [rawDate, priceStr] = l.split(',');
                    if (rawDate && priceStr) {
                        const [m, d, y] = rawDate.trim().split('/');
                        const year = y.length === 2 ? '20' + y : y;
                        const month = m.padStart(2, '0');
                        const day = d.padStart(2, '0');
                        const key = `${year}-${month}-${day}`;
                        const price = parseFloat(priceStr.trim());
                        if (!isNaN(price)) {
                            priceMap[key] = price;
                            if (price > latest) latest = price;
                            if (i === 0) latestCsvPrice = price;
                        }
                    }
                });
            } catch (e) {
                console.error(e);
            }
        }
        async function loadCurrentCSV() {
            try {
                const res = await fetch('/-/data/bitcoin-current-data.csv');
                const text = await res.text();
                const lines = text.split('\n').filter(l => l.trim());
                if (lines.length > 0) {
                    const [rawDate, priceStr] = lines[0].split(',');
                    if (rawDate && priceStr) {
                        const price = parseFloat(priceStr.trim());
                        if (!isNaN(price)) {
                            currentRate = 1 / price;
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }
        async function fetchCurrentPrice() {
            return currentRate;
        }
        async function getHistoricalPrice(year, month, day) {
            const key = `${year}-${month}-${day}`;
            if (priceMap && priceMap[key]) return 1 / priceMap[key];
            return currentRate;
        }
        function getMaxUSD() {
            if (!selectedPriceUSD) return Infinity;
            return selectedPriceUSD * TOTAL_SUPPLY;
        }
        function enforceCap() {
            const input = document.getElementById('usdAmount');
            const num = parseFloat(input.value.replace(/,/g,'')) || 0;
            const max = getMaxUSD();
            const atMax = num >= max && max !== Infinity;
            if (num > max && max !== Infinity) {
                input.value = max.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            }
            usdContainer.classList.toggle('at-max', atMax);
        }
        function updatePriceFromDate() {
            const y = document.getElementById('year').value;
            const m = document.getElementById('month').value;
            const d = document.getElementById('day').value;
            if (!y || !m || !d) {
                selectedPriceUSD = 0;
                enforceCap();
                return;
            }
            const key = `${y}-${m}-${d}`;
            selectedPriceUSD = priceMap?.[key] || 0;
            if (!selectedPriceUSD && currentRate) selectedPriceUSD = 1 / currentRate;
            enforceCap();
        }
        function populateDateSelectors() {
            const day = document.getElementById('day');
            const year = document.getElementById('year');
            day.innerHTML = '<option value="" disabled selected>Day</option>';
            year.innerHTML = '<option value="" disabled selected>Year</option>';
            for (let i = 1; i <= 31; i++) {
                const o = document.createElement('option');
                o.value = i.toString().padStart(2, '0');
                o.text = o.value;
                day.appendChild(o);
            }
            for (let i = 2011; i <= new Date().getFullYear(); i++) {
                const o = document.createElement('option');
                o.value = i;
                o.text = i;
                year.appendChild(o);
            }
            day.value = '01';
            document.getElementById('month').value = '01';
            year.value = '2011';
            updatePlaceholder();
            updatePriceFromDate();
            ['day','month','year'].forEach(id => document.getElementById(id).addEventListener('change', () => { updatePlaceholder(); updatePriceFromDate(); }));
            const usd = document.getElementById('usdAmount');
            usd.addEventListener('click', () => setTimeout(() => { if (document.activeElement !== usd) usd.focus(); }, 50));
        }
        document.getElementById('usdAmount').addEventListener('input', function() {
            let v = this.value.replace(/[^0-9.]/g, '');
            if (v.split('.').length > 2) v = v.replace(/\.(?=.*\.)/g, '');
            if (v.includes('.')) {
                const [i, d] = v.split('.');
                if (d && d.length > 2) v = i + '.' + d.slice(0, 2);
            }
            const [ip] = v.split('.');
            const c = ip.replace(/,/g, '');
            if (c) {
                const f = Number(c).toLocaleString('en-US');
                v = v.includes('.') ? `${f}.${v.split('.')[1]}` : f;
            }
            this.value = v;
            enforceCap();
        });
        const formatNumber = n => new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2, useGrouping: true }).format(n);
        const formatNumberWithSuffix = n => {
            if (isNaN(n)) return "0";
            const suffixes = [
                { threshold: 1e21, suffix: "sextillion" },
                { threshold: 1e18, suffix: "quintillion" },
                { threshold: 1e15, suffix: "quadrillion" },
                { threshold: 1e12, suffix: "trillion" },
                { threshold: 1e9, suffix: "billion" },
                { threshold: 1e6, suffix: "million" }
            ];
            for (const { threshold, suffix } of suffixes) {
                if (n >= threshold) {
                    return new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 1 }).format(n / threshold) + " " + suffix;
                }
            }
            return formatNumber(n);
        };
        const formatDate = (m, d, y) => {
            const months = { '01': 'January', '02': 'February', '03': 'March', '04': 'April', '05': 'May', '06': 'June', '07': 'July', '08': 'August', '09': 'September', '10': 'October', '11': 'November', '12': 'December' };
            const dn = parseInt(d);
            const suf = dn === 1 || dn === 21 || dn === 31 ? 'st' : dn === 2 || dn === 22 ? 'nd' : dn === 3 || dn === 23 ? 'rd' : 'th';
            return `${months[m]} ${dn}${suf}, ${y}`;
        };
        function animateNumber(start, end, elem, usd, dateStr, dur = 1000) {
            const step = 50;
            const steps = dur / step;
            const inc = (end - start) / steps;
            let cur = start;
            elem.innerText = `You would need to purchase $${formatNumberWithSuffix(cur.toFixed(2))} of bitcoin today to match $${formatNumberWithSuffix(usd)} of bitcoin from ${dateStr}.`;
            const i = setInterval(() => {
                cur += inc;
                if ((inc > 0 && cur >= end) || (inc < 0 && cur <= end)) { cur = end; clearInterval(i); }
                elem.innerText = `You would need to purchase $${formatNumberWithSuffix(cur.toFixed(2))} of bitcoin today to match $${formatNumberWithSuffix(usd)} of bitcoin from ${dateStr}.`;
            }, step);
        }
        function debounce(fn, w) {
            let t;
            return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), w); };
        }
        function updatePlaceholder() {
            const monthSelect = document.getElementById('month');
            const daySelect = document.getElementById('day');
            const yearSelect = document.getElementById('year');
            const usdInput = document.getElementById('usdAmount');
            if (!monthSelect.value || !daySelect.value || !yearSelect.value) {
                usdInput.placeholder = 'Value on selected date';
                return;
            }
            const m = monthSelect.value;
            const d = daySelect.value;
            const y = yearSelect.value;
            const monthsShort = { '01': 'Jan', '02': 'Feb', '03': 'Mar', '04': 'Apr', '05': 'May', '06': 'Jun', '07': 'Jul', '08': 'Aug', '09': 'Sep', '10': 'Oct', '11': 'Nov', '12': 'Dec' };
            const monthName = monthsShort[m];
            const dayNum = parseInt(d);
            usdInput.placeholder = `Value on ${monthName} ${dayNum}, ${y}`;
        }
        const getPrice = debounce(async () => {
            const y = document.getElementById('year').value;
            const m = document.getElementById('month').value;
            const d = document.getElementById('day').value;
            const raw = document.getElementById('usdAmount').value.trim();
            const res = document.getElementById('result');
            const usd = parseFloat(raw.replace(/,/g, ''));
            if (!y || !m || !d || isNaN(usd) || usd <= 0) { res.innerText = 'Invalid input.'; return; }
            const date = new Date(`${y}-${m}-${d}T00:00:00`);
            if (date.getFullYear() != y || date.getMonth() + 1 != parseInt(m) || date.getDate() != parseInt(d)) { res.innerText = 'Invalid date'; return; }
            const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            if (isNaN(date)) { res.innerText = 'Invalid date.'; return; }
            if (date > yesterday) { res.innerText = 'Date must be on or before yesterday.'; return; }
            const fmt = formatDate(m, d, y);
            await loadCSV();
            const [hist, cur] = await Promise.all([getHistoricalPrice(y, m, d), fetchCurrentPrice()]);
            const btc = usd * hist;
            const now = btc / cur;
            animateNumber(usd, now, res, usd, fmt);
        }, 150);
        populateDateSelectors();
        Promise.all([loadCSV(), loadCurrentCSV()]).then(() => {
            updatePriceFromDate();
});
    </script>
</body>
</html>
