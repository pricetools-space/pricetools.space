<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mining</title>
  <link rel="icon" type="image/png" href="/-/favicon-files/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/-/favicon-files/favicon.svg">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/-/favicon-files/apple-touch-icon.png">
  <link rel="manifest" href="/-/favicon-files/site.webmanifest">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .content {
      width: 100%;
      max-width: 360px;
      margin-block: auto;
      padding: 0 1rem;
      text-align: center;
    }
    .converter {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .input-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .input-container {
      position: relative;
      flex: 1;
    }
    input, select {
      width: 100%;
      background: #000;
      color: #fff;
      border: 1px solid #555;
      border-radius: 10px;
      font-size: 24px;
      padding: 20px;
      appearance: none;
    }
    input:hover, input:focus, select:hover, select:focus {
      background: #111;
      outline: none;
    }
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }
    select { cursor: pointer; padding-right: 32px; }
    .sats-container::after { content: 'sats per day'; }
    .chance::after { content: 'per day'; }
    .time::after { content: attr(data-unit); }
    .power::after { content: 'Watts'; }
    .kwh::after { content: 'per kWh'; }
    .daily-cost::after { content: 'usd per day'; }
    .sats-cost::after { content: 'sats per day'; }
    .sats-container::after, .chance::after, .time::after,
    .power::after, .kwh::after, .daily-cost::after, .sats-cost::after {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      pointer-events: none;
    }
    .power input { padding-right: 96px; }
    .chance input { padding-right: 108px; }
    .time input { padding-right: 0px; }
    .kwh input { padding: 20px 32px 20px 32px; }
    .daily-cost input, .sats-container input, .sats-cost input {
      padding: 20px 154px 20px 32px;
    }
    .kwh::before, .daily-cost::before {
      content: '$';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      pointer-events: none;
    }
    .sats-container::before, .sats-cost::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 51%;
      transform: translateY(-50%);
      width: 1.2em;
      height: 1.2em;
      background: url('/-/images/sats.svg') center/contain no-repeat;
      pointer-events: none;
    }
    .menu {
      font-size: 3rem;
      font-weight: 100;
      color: #666;
      margin-block-end: 2vh;
      text-decoration: none;
      transition: color 0.5s ease;
    }
    .menu:hover { color: #fff; }
    .mode-group {
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="content">
    <div class="converter">
      <div class="input-container">
        <select id="mode">
          <option value="profit">Mining Profit</option>
          <option value="cost">Mining Cost</option>
        </select>
      </div>
      <div class="input-group" id="hashrate-container">
        <div class="input-container">
          <input type="text" inputmode="decimal" id="hashrate" placeholder="Hashrate">
        </div>
        <div class="input-container">
          <select id="hash-unit">
            <option value="KH">KH/s</option>
            <option value="MH">MH/s</option>
            <option value="GH">GH/s</option>
            <option value="TH" selected>TH/s</option>
            <option value="PH">PH/s</option>
            <option value="EH">EH/s</option>
          </select>
        </div>
      </div>
      <div id="profit" class="mode-group">
        <div class="input-container sats-container">
          <input type="tel" inputmode="numeric" id="dailysats" placeholder="Pool Payout">
        </div>
        <div class="input-container chance">
          <input type="text" id="chance" readonly placeholder="Solo Odds">
        </div>
        <div class="input-container time">
          <input type="text" id="expected" readonly placeholder="Avg Time to Win a Block">
        </div>
      </div>
      <div id="cost" class="mode-group">
        <div class="input-container power">
          <input type="text" inputmode="decimal" id="power" placeholder="Power">
        </div>
        <div class="input-container kwh">
          <input type="text" inputmode="decimal" id="kwh" placeholder="Electricity Cost">
        </div>
        <div class="input-container daily-cost">
          <input type="text" id="dailycost" readonly placeholder="Cost To Run">
        </div>
        <div class="input-container sats-cost">
          <input type="text" id="costsats" readonly placeholder="Cost in Sats">
        </div>
      </div>
    </div>
  </div>
  <a data-open-drawer class="menu">≡</a>
  <script src="/menu/drawer.js"></script>
  <script>
    const modeSelect = document.getElementById('mode');
    const hashrateContainer = document.getElementById('hashrate-container');
    const groups = { profit: document.getElementById('profit'), cost: document.getElementById('cost') };

    function showGroup() {
      const m = modeSelect.value;
      Object.values(groups).forEach(g => g.style.display = 'none');
      groups[m].style.display = 'flex';
      hashrateContainer.classList.toggle('hidden', m === 'cost');
    }

    let networkHashrate = 0;
    let avgRewardSats = 0;
    let btcPrice = 0;
    const satsPerBTC = 100000000;
    const blocksPerDay = 144;
    const blockIntervalSeconds = 600;

    async function loadMiningData() {
      try {
        const r = await fetch('/-/data/mining-data.csv');
        const t = await r.text();
        const lines = t.trim().split('\n').filter(l => l.trim());
        if (lines.length > 0) {
          const parts = lines[lines.length - 1].split(',');
          networkHashrate = Number(parts[1]) || 0;
          if (parts.length >= 3) avgRewardSats = Number(parts[2]) || 0;
        }
      } catch {}
    }

    async function loadBTCPrice() {
      try {
        const res = await fetch('/-/data/bitcoin-current-data.csv');
        const text = await res.text();
        const lines = text.split('\n').filter(l => l.trim());
        if (lines.length > 0) {
          const price = parseFloat(lines[0].split(',')[1]?.trim());
          if (!isNaN(price) && price > 0) btcPrice = price;
        }
      } catch {}
    }

    function clean(v) { return parseFloat(v.replace(/,/g, '')) || 0; }

    function getHashrateTH() {
      const val = clean(document.getElementById('hashrate').value);
      const unit = document.getElementById('hash-unit').value;
      const multipliers = { KH: 1e-9, MH: 1e-6, GH: 1e-3, TH: 1, PH: 1e3, EH: 1e6 };
      return val * (multipliers[unit] || 1);
    }

    function restrictInput(el, maxDec = 2) {
      el.addEventListener('input', () => {
        let v = el.value.replace(/[^0-9.]/g, '');
        if (v.includes('.')) {
          const parts = v.split('.');
          parts[1] = parts[1].slice(0, maxDec);
          v = parts.join('.');
        }
        const [i, d] = v.split('.');
        const f = i ? Number(i).toLocaleString('en-US') : '';
        el.value = d !== undefined ? `${f}.${d}` : f;
      });
    }

    function restrictInputNoDecimal(el) {
      el.addEventListener('input', () => {
        let v = el.value.replace(/[^0-9]/g, '');
        el.value = v ? Number(v).toLocaleString('en-US') : '';
      });
    }

    function updateFromPoolPayout() {
      const dailySats = clean(document.getElementById('dailysats').value);
      const chanceEl = document.getElementById('chance');
      const expEl = document.getElementById('expected');
      const timeCont = expEl.parentElement;
      if (dailySats > 0 && networkHashrate > 0 && avgRewardSats > 0 && blocksPerDay > 0) {
        const dailyRewardSats = avgRewardSats * blocksPerDay;
        const share = dailySats / dailyRewardSats;
        if (share > 0) {
          const hashrateTH = share * (networkHashrate / 1e12);
          document.getElementById('hashrate').value = hashrateTH.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          document.getElementById('hash-unit').value = 'TH';
          const dailyProb = share * blocksPerDay;
          chanceEl.value = dailyProb >= 1 ? Math.round(dailyProb).toLocaleString('en-US') : `1 in ${Math.round(1 / dailyProb).toLocaleString('en-US')}`;
          const expSec = blockIntervalSeconds / share;
          const y = expSec / 31536000;
          const d = expSec / 86400;
          const h = expSec / 3600;
          let txt = '';
          if (y >= 2) txt = y.toFixed(1) + ' years';
          else if (y >= 0.1) txt = y.toFixed(2) + ' years';
          else if (d >= 30) txt = Math.floor(d / 30).toLocaleString('en-US') + ' months';
          else if (d >= 1) txt = d.toFixed(1) + ' days';
          else if (h >= 1) txt = (h < 10 ? h.toFixed(1) : h.toFixed(0)) + ' hours';
          else txt = '0 hours';
          expEl.value = txt.replace(/ (years|months|days|hours)$/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
          timeCont.dataset.unit = txt.match(/ (years|months|days|hours)/)?.[1] || '';
        } else {
          document.getElementById('hashrate').value = '';
          chanceEl.value = '';
          expEl.value = '';
          timeCont.dataset.unit = '';
        }
      } else {
        document.getElementById('hashrate').value = '';
        chanceEl.value = '';
        expEl.value = '';
        timeCont.dataset.unit = '';
      }
    }

    function update() {
      const mode = modeSelect.value;
      const hrTH = getHashrateTH();

      if (mode === 'profit') {
        const satsEl = document.getElementById('dailysats');
        const chanceEl = document.getElementById('chance');
        const expEl = document.getElementById('expected');
        const timeCont = expEl.parentElement;
        if (hrTH > 0 && networkHashrate > 0 && avgRewardSats > 0) {
          const share = hrTH / (networkHashrate / 1e12);
          const dailySats = Math.floor(share * avgRewardSats * blocksPerDay);
          satsEl.value = dailySats.toLocaleString('en-US');
          const dailyProb = share * blocksPerDay;
          chanceEl.value = dailyProb >= 1 ? Math.round(dailyProb).toLocaleString('en-US') : `1 in ${Math.round(1 / dailyProb).toLocaleString('en-US')}`;
          const expSec = blockIntervalSeconds / share;
          const y = expSec / 31536000;
          const d = expSec / 86400;
          const h = expSec / 3600;
          let txt = '';
          if (y >= 2) txt = y.toFixed(1) + ' years';
          else if (y >= 0.1) txt = y.toFixed(2) + ' years';
          else if (d >= 30) txt = Math.floor(d / 30).toLocaleString('en-US') + ' months';
          else if (d >= 1) txt = d.toFixed(1) + ' days';
          else if (h >= 1) txt = (h < 10 ? h.toFixed(1) : h.toFixed(0)) + ' hours';
          else txt = '0 hours';
          expEl.value = txt.replace(/ (years|months|days|hours)$/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
          timeCont.dataset.unit = txt.match(/ (years|months|days|hours)/)?.[1] || '';
        } else {
          satsEl.value = '';
          chanceEl.value = '';
          expEl.value = '';
          timeCont.dataset.unit = '';
        }
      } else if (mode === 'cost') {
        const p = clean(document.getElementById('power').value);
        const k = clean(document.getElementById('kwh').value);
        const costEl = document.getElementById('dailycost');
        const satsEl = document.getElementById('costsats');
        const dailyCostUSD = p > 0 && k > 0 ? (p * 24 / 1000) * k : 0;
        costEl.value = dailyCostUSD ? Number.isInteger(dailyCostUSD) ? dailyCostUSD.toLocaleString('en-US') : dailyCostUSD.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
        if (dailyCostUSD > 0 && btcPrice > 0) {
          const dailyCostSats = Math.floor((dailyCostUSD / btcPrice) * satsPerBTC);
          satsEl.value = dailyCostSats.toLocaleString('en-US');
        } else {
          satsEl.value = '';
        }
      }
    }

    modeSelect.addEventListener('change', () => { showGroup(); update(); });
    document.getElementById('hashrate').addEventListener('input', update);
    document.getElementById('hash-unit').addEventListener('change', update);
    document.getElementById('dailysats').addEventListener('input', updateFromPoolPayout);
    document.getElementById('power').addEventListener('input', update);
    document.getElementById('kwh').addEventListener('input', update);

    restrictInput(document.getElementById('hashrate'), 2);
    restrictInputNoDecimal(document.getElementById('dailysats'));
    restrictInput(document.getElementById('power'));
    restrictInput(document.getElementById('kwh'), 4);

    showGroup();
    Promise.all([loadMiningData(), loadBTCPrice()]).then(update);
  </script>
</body>
</html>
