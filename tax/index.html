<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Calculator</title>
    <link rel="icon" type="image/png" href="/-/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/-/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/-/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/-/favicon-files/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            background: #000;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .content { width: 100%; max-width: 360px; margin-block: auto; }
        h1 {
            font-size: 32px;
            margin-bottom: 24px;
            text-align: center;
        }
        .inputs {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 100%;
        }
        .input-container {
            position: relative;
            width: 100%;
        }
        input, button {
            width: 100%;
            background: #000;
            color: #fff;
            border: 1px solid #555;
            border-radius: 10px;
            font-size: 24px;
            padding: 20px 12px;
            -webkit-appearance: none;
            appearance: none;
        }
        .usd-container input {
            padding-left: 32px;
            padding-right: 72px;
        }
        #taxRate {
            padding-right: 72px;
        }
        input:hover, input:focus,
        button:hover, button:focus {
            background: #111;
            outline: none;
        }
        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }
        .usd-container::before {
            content: '$';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            pointer-events: none;
        }
        .usd-container::after,
        .tax-container::after {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
        }
        .usd-container::after { content: 'max'; }
        .tax-container::after { content: '%'; }
        .usd-container.at-max::after,
        .tax-container.at-max::after,
        .tax-container.filled::after { opacity: 1; }
        button { cursor: pointer; }
        .result-wrapper {
            width: 100%;
            min-height: 100px;
            margin-top: 20px;
            text-align: center;
        }
        #result {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.4;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu {
            font-size: 3rem;
            font-weight: 100;
            color: #666;
            margin-block-end: 2vh;
            text-decoration: none;
            transition: color 0.5s ease;
        }
        .menu:hover { color: #fff; }
        @media (min-width: 768px) {
            .content { max-width: 360px; }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="inputs">
            <div class="input-container usd-container" id="buyContainer">
                <input type="tel" id="buyPrice" placeholder="Price when bought">
            </div>
            <div class="input-container usd-container" id="sellContainer">
                <input type="tel" id="sellPrice" placeholder="Price when sold">
            </div>
            <div class="input-container usd-container" id="proceedsContainer">
                <input type="tel" id="soldUSD" placeholder="Proceeds">
            </div>
            <div class="input-container tax-container" id="taxContainer">
                <input type="tel" id="taxRate" placeholder="Tax rate (%)">
            </div>
            <button onclick="run()">Calculate</button>
            <div class="result-wrapper">
                <div id="result"></div>
            </div>
        </div>
    </div>
    <a data-open-drawer class="menu">≡</a>
    <script src="/menu/drawer.js"></script>
    <script>
const MAX_PRICE = 1000000000;
const MAX_PROCEEDS = 1000000000;
const MAX_TAX = 100;

function formatInput(el, max = Infinity) {
  el.addEventListener('input', () => {
    let v = el.value.replace(/[^0-9.]/g, '');
    let num = parseFloat(v) || 0;
    if (num > max && max !== Infinity) {
      num = max;
      v = max.toString();
    }
    if (v) el.value = Number(v).toLocaleString('en-US');
    else el.value = '';
    const atMax = max !== Infinity && num >= max;
    el.parentElement.classList.toggle('at-max', atMax);
    if (el.id === 'taxRate') {
      el.parentElement.classList.toggle('filled', v.length > 0);
    }
  });
}

formatInput(document.getElementById('buyPrice'), MAX_PRICE);
formatInput(document.getElementById('sellPrice'), MAX_PRICE);
formatInput(document.getElementById('soldUSD'), MAX_PROCEEDS);
formatInput(document.getElementById('taxRate'), MAX_TAX);

function fmt(n){return new Intl.NumberFormat('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}).format(Math.round(n))}
function clean(v){return parseFloat(v.replace(/,/g,''))||0}

function run(){
  const buy = clean(document.getElementById('buyPrice').value);
  const sell = clean(document.getElementById('sellPrice').value);
  const soldUSD = clean(document.getElementById('soldUSD').value);
  const taxPct = clean(document.getElementById('taxRate').value)/100;
  if(!buy||!sell||!soldUSD || taxPct < 0){
    document.getElementById('result').innerText='Fill every field'; return;
  }
  const amountSold = soldUSD / sell;
  const cost = amountSold * buy;
  const profit = soldUSD - cost;
  let resultHTML = `Amount Paid: $${fmt(cost)}<br>`;
  if (profit >= 0) {
    const tax = profit * taxPct;
    resultHTML += `Gain: $${fmt(profit)}<br>Tax on gain: $${fmt(tax)}`;
  } else {
    resultHTML += `Loss: $${fmt(Math.abs(profit))}`;
  }
  document.getElementById('result').innerHTML = resultHTML;
}
    </script>
</body>
</html>
