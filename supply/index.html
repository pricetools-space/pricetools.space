<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage of Supply</title>
    <link rel="icon" type="image/png" href="/-/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/-/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/-/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/-/favicon-files/site.webmanifest">
    <meta property="og:title" content="Percentage of the total Bitcoin supply">
    <meta property="og:description" content="See what percentage of Bitcoin's total available supply an entered amount is.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/-/images/preview-catchup.png">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            min-height:100dvh;
            background:#000;
            color:#fff;
            font-family:system-ui,sans-serif;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:space-between
        }
        .content{
            width:100%;
            max-width:360px;
            margin-block:auto;
            padding:0 1rem;
            text-align:center
        }
        h1{
            font-size:32px;
            margin-bottom:24px
        }
        .converter{
            display:flex;
            flex-direction:column;
            gap:10px;
            width:100%
        }
        .input-container{
            position:relative;
            width:100%
        }
        select,input{
            width:100%;
            background:#000;
            color:#fff;
            border:1px solid #555;
            border-radius:10px;
            font-size:24px;
            padding:20px 12px;
            -webkit-appearance:none;
            appearance:none
        }
        .btc-container input{
            padding-left:42px;
            padding-right:82px
        }
        .percent-container input{
            padding-left:18px;
            padding-right:72px
        }
        select:hover,select:focus,
        input:hover,input:focus{
            background:#111;
            outline:none
        }
        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button{
            -webkit-appearance:none
        }
        .btc-container::before{
            content:"₿";
            position:absolute;
            left:16px;
            top:50%;
            transform:translateY(-50%);
            font-size:28px
        }
        .percent-container::after{
            content:"%";
            position:absolute;
            right:18px;
            top:50%;
            transform:translateY(-50%);
            font-size:24px;
            opacity:0;
            transition:opacity .2s;
            pointer-events:none
        }
        .btc-container::after{
            content:"max";
            position:absolute;
            right:18px;
            top:50%;
            transform:translateY(-50%);
            font-size:24px;
            opacity:0;
            transition:opacity .2s;
            color:#aaa;
            pointer-events:none
        }
        .btc-container.at-max::after,
        .percent-container.at-max::after,
        .percent-container.filled::after{
            opacity:1
        }
        .menu{
            font-size:3rem;
            font-weight:100;
            color:#666;
            margin-block-end:2vh;
            text-decoration:none;
            transition:color .5s
        }
        .menu:hover{color:#fff}
    </style>
</head>
<body>
    <div class="content">
        <div class="converter">
            <div class="input-container btc-container" id="btcContainer">
                <input type="tel" inputmode="decimal" id="btc" placeholder="BTC">
            </div>
            <div class="input-container percent-container" id="percentContainer">
                <input type="tel" inputmode="decimal" id="percent" placeholder="Percentage">
            </div>
        </div>
    </div>
    <a data-open-drawer class="menu">≡</a>
    <script src="/menu/drawer.js"></script>
    <script>
        const MAX_SUPPLY = 21000000;
        const btcContainer = document.getElementById('btcContainer');
        const percentContainer = document.getElementById('percentContainer');
        const btcInput = document.getElementById('btc');
        const percentInput = document.getElementById('percent');

        function formatNumber(n){
            return n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:8});
        }

        function enforceCap(){
            let btcVal = btcInput.value.replace(/,/g,'');
            let percVal = parseFloat(percentInput.value.replace(/,/g,''))||0;
            let btcNum = parseFloat(btcVal)||0;

            const btcAtMax = btcNum >= MAX_SUPPLY*0.999999;
            const percAtMax = percVal >= 99.999999;

            btcContainer.classList.toggle('at-max',btcAtMax);
            percentContainer.classList.toggle('at-max',percAtMax);
            percentContainer.classList.toggle('filled',percentInput.value.length>0);

            if(btcNum>MAX_SUPPLY){
                btcInput.value = formatNumber(MAX_SUPPLY);
            }
            if(percVal>100){
                percentInput.value = '100';
            }
        }

        function syncValues(from){
            const supply = MAX_SUPPLY;
            if(from==='btc'){
                let btcStr = btcInput.value.replace(/,/g,'');
                if(btcStr&&btcStr!=='.'){
                    let btc = parseFloat(btcStr);
                    if(!isNaN(btc)&&btc>0){
                        const perc = (btc/supply)*100;
                        percentInput.value = perc.toFixed(15).replace(/\.?0+$/,'') || '0';
                    }else percentInput.value='';
                }else percentInput.value='';
            }else{
                let perc = parseFloat(percentInput.value.replace(/,/g,''))||0;
                if(perc>0){
                    const btc = (perc/100)*supply;
                    btcInput.value = formatNumber(btc);
                }else btcInput.value='';
            }
            enforceCap();
        }

        function formatInput(el,isBtc=false,isPercent=false){
            el.addEventListener('input',function(){
                let v = this.value.replace(/[^0-9.]/g,'');
                if(v.split('.').length>2) v = v.replace(/\.(?=.*\.)/g,'');
                if(v.startsWith('.')) v = '0'+v;
                if(isBtc){
                    let dec = v.split('.')[1];
                    if(dec&&dec.length>8) v = v.slice(0,v.indexOf('.')+9);
                }
                if(isPercent && v.length>18) v = v.slice(0,18);
                let [int,dec] = v.split('.');
                int = int||'0';
                let raw = parseInt(int.replace(/^0+/,'')||'0');
                let formatted = raw ? raw.toLocaleString('en-US') : '';
                this.value = dec!==undefined ? `${formatted}.${dec}` : formatted||'';
                syncValues(this.id);
            });
        }

        formatInput(btcInput,true);
        formatInput(percentInput,false,true);
        enforceCap();
    </script>
</body>
</html>
