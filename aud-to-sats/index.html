<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUD to Sats</title>
    <meta name="description" content="Instant AUD to Satoshi converter with live Bitcoin price.">
    <meta name="keywords" content="aud to sats, satoshi converter, bitcoin converter">
    <meta property="og:title" content="AUD to SATS Converter">
    <meta property="og:description" content="Convert AUD to Satoshis instantly using live Bitcoin price.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/-/images/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="/-/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/-/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/-/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/-/favicon-files/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            background: #000;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .content {
            width: 100%;
            max-width: 360px;
            margin-block: auto;
            padding: 0 1rem;
            text-align: center;
        }
        h1 { font-size: 32px; margin-bottom: 24px; }
        .converter { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .input-container { position: relative; width: 100%; }
        input {
            width: 100%;
            background: #000;
            color: #fff;
            border: 1px solid #555;
            border-radius: 10px;
            font-size: 24px;
            padding: 20px 12px;
            -webkit-appearance: none;
            appearance: none;
        }
        .aud-container input,
        .sats-container input { padding-left: 32px; }
        .sats-container input { padding-right: 72px; }
        input:hover,
        input:focus { background: #111; outline: none; }
        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button { -webkit-appearance: none; }
        .aud-container::before {
            content: '$';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            pointer-events: none;
        }
        .sats-container::before, .sats-cost::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 51%;
            transform: translateY(-50%);
            width: 1.2em;
            height: 1.2em;
            background: url('/-/images/sats.svg') center/contain no-repeat;
            pointer-events: none;
        }
        .sats-container::after {
            content: 'sats';
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            opacity: 0;
            transition: opacity .2s;
        }
        .sats-container.filled::after { opacity: 1; }
        .menu {
            font-size: 3rem;
            font-weight: 100;
            color: #666;
            margin-block-end: 2vh;
            text-decoration: none;
            transition: color 0.5s ease;
        }
        .menu:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="content">
        <div class="converter">
            <div class="input-container aud-container">
                <input type="tel" inputmode="decimal" id="aud" placeholder="AUD">
            </div>
            <div class="input-container sats-container">
                <input type="tel" inputmode="numeric" id="sats" placeholder="SATS">
            </div>
        </div>
    </div>
    <a data-open-drawer class="menu">≡</a>
    <script src="/menu/drawer.js"></script>
    <script>
        const btcToSats = 100000000;
        let currentRate = null;
        async function loadCurrentCSV() {
            try {
                const res = await fetch('/-/data/bitcoin-current-data-aud.csv');
                const text = await res.text();
                const lines = text.split('\n').filter(l => l.trim());
                if (lines.length > 0) {
                    const price = parseFloat(lines[0].split(',')[1].trim());
                    if (!isNaN(price) && price > 0) currentRate = 1 / price;
                }
            } catch (e) {
                console.error(e);
            }
        }
        function restrictInput(el, maxDecimals = 8) {
            el.addEventListener('input', () => {
                let v = el.value.replace(/[^0-9.]/g, '');
                if (v.includes('.') && maxDecimals > 0)
                    v = v.split('.').map((p,i) => i ? p.slice(0,maxDecimals) : p).join('.');
                else if (maxDecimals === 0) v = v.replace(/\./g, '');
                const [int, dec] = v.split('.');
                const formatted = int ? Number(int).toLocaleString('en-US') : '';
                el.value = dec !== undefined ? `${formatted}.${dec}` : formatted;
            });
        }
        const audIn = document.getElementById('aud');
        const satsIn = document.getElementById('sats');
        const satsContainer = satsIn.parentElement;
        restrictInput(audIn, 2);
        restrictInput(satsIn, 0);
        satsIn.addEventListener('input', () => {
            satsContainer.classList.toggle('filled', satsIn.value.length > 0);
        });
        function updateConversions() {
            if (currentRate === null) return;
            const active = document.activeElement;
            const audVal = parseFloat(audIn.value.replace(/,/g, '')) || 0;
            const satsVal = BigInt(satsIn.value.replace(/,/g, '') || '0');
            if (active === audIn || !active.closest('.input-container')) {
                if (audVal > 0) {
                    const sats = Math.floor(audVal * currentRate * btcToSats);
                    satsIn.value = sats.toLocaleString('en-US');
                    satsContainer.classList.add('filled');
                } else {
                    satsIn.value = '';
                    satsContainer.classList.remove('filled');
                }
            } else if (active === satsIn) {
                if (satsVal > 0n) {
                    const aud = Number(satsVal) / btcToSats / currentRate;
                    audIn.value = aud.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    satsContainer.classList.add('filled');
                } else {
                    audIn.value = '';
                    satsContainer.classList.remove('filled');
                }
            }
        }
        audIn.addEventListener('input', () => setTimeout(updateConversions, 0));
        satsIn.addEventListener('input', () => setTimeout(updateConversions, 0));
        loadCurrentCSV().then(updateConversions);
    </script>
</body>
</html>
