<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Price Tool</title>
    <meta name="description" content="Calculate what your Bitcoin or USD will be worth in any future year at any annual return rate.">
    <link rel="icon" type="image/png" href="/-/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/-/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/-/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/-/favicon-files/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh; background: #000; color: #fff;
            font-family: system-ui, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
        }
        .content {
            width: 100%; max-width: 360px;
            margin-block: auto;
        }
        .converter {
            display: flex; flex-direction: column;
            gap: 10px; width: 100%;
        }
        .row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .row > * {
            flex: 1;
            min-width: 0;
        }
        .year-container, .percent-container {
            position: relative;
            flex: 1;
        }
        input, select, button {
            width: 100%;
            background: #000; color: #fff;
            border: 1px solid #555;
            border-radius: 10px;
            font-size: 24px;
            padding: 20px 12px;
            -webkit-appearance: none; appearance: none;
        }
        select {
            text-align: center;
            text-align-last: center;
            padding: 20px 12px;
        }
        .usd-container, .percent-container {
            position: relative;
        }
        .usd-container::before {
            content: '$';
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%);
            font-size: 24px; pointer-events: none;
        }
        .percent-container::after {
            content: '%';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            color: #aaa;
            pointer-events: none;
        }
        .usd-container input { padding-left: 32px; padding-right: 12px; }
        .percent-container input { padding-left: 20px; padding-right: 36px; text-align: center; }
        input:hover, input:focus, select:hover, select:focus, button:hover, button:focus {
            background: #111; outline: none;
        }
        input::-webkit-inner-spin-button { -webkit-appearance: none; }
        button { cursor: pointer; }
        .result-wrapper {
            width: 100%; min-height: 140px; text-align: center;
        }
        #result {
            margin-top: 20px; font-size: 20px; font-weight: bold;
            color: #fff; min-height: 120px;
            display: flex; align-items: center; justify-content: center;
            text-align: center; line-height: 1.4;
        }
        .menu {
            font-size: 3rem; font-weight: 100; color: #666;
            text-decoration: none; transition: color .2s;
            margin-block-end: 2vh;
        }
        .menu:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="content">
        <div class="converter">
            <div class="row">
                <div class="year-container">
                    <select id="year" required>
                        <option value="" disabled selected>Select Year</option>
                    </select>
                </div>
                <div class="percent-container">
                    <input type="tel" id="returnRate" value="60" maxlength="4">
                </div>
            </div>
            <div class="usd-container">
                <input type="tel" inputmode="decimal" id="usd" placeholder="USD">
            </div>
            <button onclick="calculate()">What will it be worth?</button>
            <div class="result-wrapper">
                <div id="result"></div>
            </div>
        </div>
    </div>
    <a data-open-drawer class="menu">≡</a>

    <script src="/menu/drawer.js"></script>
    <script>
        const usdIn = document.getElementById('usd');
        let displayRate, year, usdVal;

        usdIn.addEventListener('input', function() {
            let v = this.value.replace(/[^0-9.]/g, '');
            if (v.split('.').length > 2) v = v.replace(/\.(?=.*\.)/g, '');
            if (v.includes('.')) {
                const [i, dec] = v.split('.');
                if (dec && dec.length > 2) v = i + '.' + dec.slice(0, 2);
            }
            const [int] = v.split('.');
            if (int) v = Number(int).toLocaleString('en-US') + (v.includes('.') ? '.' + v.split('.')[1] : '');
            this.value = v;
        });

        document.getElementById('returnRate').addEventListener('input', function() {
            let v = this.value.replace(/[^0-9.]/g, '');
            if (v.includes('.')) {
                const [i, dec] = v.split('.');
                if (dec && dec.length > 3) v = i + '.' + dec.slice(0, 3);
            }
            const [int] = v.split('.');
            if (int) v = Number(int).toLocaleString('en-US') + (v.includes('.') ? '.' + v.split('.')[1] : '');
            this.value = v;
        });

        function populateYears() {
            const sel = document.getElementById('year');
            const y = new Date().getFullYear();
            for (let i = y + 1; i <= y + 50; i++) {
                const o = document.createElement('option');
                o.value = o.text = i;
                sel.appendChild(o);
            }
        }
        populateYears();

        const suffixes = [
            { t: 1e303, s: "centillion" },
            { t: 1e300, s: "novemnonagintillion" },
            { t: 1e297, s: "octononagintillion" },
            { t: 1e294, s: "septennonagintillion" },
            { t: 1e291, s: "sexnonagintillion" },
            { t: 1e288, s: "quinnonagintillion" },
            { t: 1e285, s: "quattuornonagintillion" },
            { t: 1e282, s: "trenonagintillion" },
            { t: 1e279, s: "duononagintillion" },
            { t: 1e276, s: "unnonagintillion" },
            { t: 1e273, s: "nonagintillion" },
            { t: 1e270, s: "novenoctogintillion" },
            { t: 1e267, s: "octooctogintillion" },
            { t: 1e264, s: "septenoctogintillion" },
            { t: 1e261, s: "sexoctogintillion" },
            { t: 1e258, s: "quinoctogintillion" },
            { t: 1e255, s: "quattuoroctogintillion" },
            { t: 1e252, s: "treoctogintillion" },
            { t: 1e249, s: "duooctogintillion" },
            { t: 1e246, s: "unoctogintillion" },
            { t: 1e243, s: "octogintillion" },
            { t: 1e240, s: "novenseptuagintillion" },
            { t: 1e237, s: "octoseptuagintillion" },
            { t: 1e234, s: "septenseptuagintillion" },
            { t: 1e231, s: "sexseptuagintillion" },
            { t: 1e228, s: "quinseptuagintillion" },
            { t: 1e225, s: "quattuorseptuagintillion" },
            { t: 1e222, s: "treseptuagintillion" },
            { t: 1e219, s: "duoseptuagintillion" },
            { t: 1e216, s: "unseptuagintillion" },
            { t: 1e213, s: "septuagintillion" },
            { t: 1e210, s: "novensexagintillion" },
            { t: 1e207, s: "octosexagintillion" },
            { t: 1e204, s: "septensexagintillion" },
            { t: 1e201, s: "sexsexagintillion" },
            { t: 1e198, s: "quinsexagintillion" },
            { t: 1e195, s: "quattuorsexagintillion" },
            { t: 1e192, s: "tresexagintillion" },
            { t: 1e189, s: "duosexagintillion" },
            { t: 1e186, s: "unsexagintillion" },
            { t: 1e183, s: "sexagintillion" },
            { t: 1e180, s: "novemquinquagintillion" },
            { t: 1e177, s: "octoquinquagintillion" },
            { t: 1e174, s: "septenquinquagintillion" },
            { t: 1e171, s: "sexquinquagintillion" },
            { t: 1e168, s: "quinquinquagintillion" },
            { t: 1e165, s: "quattuorquinquagintillion" },
            { t: 1e162, s: "trequinquagintillion" },
            { t: 1e159, s: "duoquinquagintillion" },
            { t: 1e156, s: "unquinquagintillion" },
            { t: 1e153, s: "quinquagintillion" },
            { t: 1e150, s: "novemquadragintillion" },
            { t: 1e147, s: "octoquadragintillion" },
            { t: 1e144, s: "septenquadragintillion" },
            { t: 1e141, s: "sexquadragintillion" },
            { t: 1e138, s: "quinquadragintillion" },
            { t: 1e135, s: "quattuorquadragintillion" },
            { t: 1e132, s: "trequadragintillion" },
            { t: 1e129, s: "duoquadragintillion" },
            { t: 1e126, s: "unquadragintillion" },
            { t: 1e123, s: "quadragintillion" },
            { t: 1e120, s: "novemtrigintillion" },
            { t: 1e117, s: "octotrigintillion" },
            { t: 1e114, s: "septentrigintillion" },
            { t: 1e111, s: "sextrigintillion" },
            { t: 1e108, s: "quintrigintillion" },
            { t: 1e105, s: "quattuortrigintillion" },
            { t: 1e102, s: "tretrigintillion" },
            { t: 1e99,  s: "duotrigintillion" },
            { t: 1e96,  s: "untrigintillion" },
            { t: 1e93,  s: "trigintillion" },
            { t: 1e90,  s: "novemvigintillion" },
            { t: 1e87,  s: "octovigintillion" },
            { t: 1e84,  s: "septenvigintillion" },
            { t: 1e81,  s: "sexvigintillion" },
            { t: 1e78,  s: "quinvigintillion" },
            { t: 1e75,  s: "quattuorvigintillion" },
            { t: 1e72,  s: "trevigintillion" },
            { t: 1e69,  s: "duovigintillion" },
            { t: 1e66,  s: "unvigintillion" },
            { t: 1e63,  s: "vigintillion" },
            { t: 1e60,  s: "novemdecillion" },
            { t: 1e57,  s: "octodecillion" },
            { t: 1e54,  s: "septendecillion" },
            { t: 1e51,  s: "sexdecillion" },
            { t: 1e48,  s: "quindecillion" },
            { t: 1e45,  s: "quattuordecillion" },
            { t: 1e42,  s: "tredecillion" },
            { t: 1e39,  s: "duodecillion" },
            { t: 1e36,  s: "undecillion" },
            { t: 1e33,  s: "decillion" },
            { t: 1e30,  s: "nonillion" },
            { t: 1e27,  s: "octillion" },
            { t: 1e24,  s: "septillion" },
            { t: 1e21,  s: "sextillion" },
            { t: 1e18,  s: "quintillion" },
            { t: 1e15,  s: "quadrillion" },
            { t: 1e12,  s: "trillion" },
            { t: 1e9,   s: "billion" },
            { t: 1e6,   s: "million" }
        ];

        const fmtBig = n => {
            if (n >= 1e6) {
                for (const o of suffixes) {
                    if (n >= o.t) {
                        const val = n / o.t;
                        const coeff = Number(val.toFixed(1));
                        if (coeff % 1 === 0) return coeff + ' ' + o.s;
                        return val.toFixed(1) + ' ' + o.s;
                    }
                }
            }
            const formatted = new Intl.NumberFormat('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
                useGrouping: true
            }).format(n);
            return formatted.endsWith('.00') ? formatted.slice(0, -3) : formatted;
        };

        function animate(start, end, el, usd, year) {
            const dur = 1200, step = 50, inc = (end - start) / (dur / step);
            let cur = start;
            const update = () => {
                el.textContent = `At ${displayRate}% annual returns: $${fmtBig(usd)} will be worth $${fmtBig(cur)} in ${year}`;
            };
            const id = setInterval(() => {
                cur += inc;
                if ((inc > 0 && cur >= end) || (inc < 0 && cur <= end)) {
                    cur = end;
                    clearInterval(id);
                }
                update();
            }, step);
            update();
        }

        window.calculate = () => {
            year = parseInt(document.getElementById('year').value);
            usdVal = parseFloat(usdIn.value.replace(/,/g, '')) || 0;
            const rateInput = document.getElementById('returnRate');
            const rateVal = rateInput.value.replace(/,/g, '');

            if (!year || !usdVal || !rateVal) {
                document.getElementById('result').textContent = 'Select year, amount and annual return rate';
                return;
            }

            const ratePct = parseFloat(rateVal);
            displayRate = rateVal;

            const yearsDiff = year - new Date().getFullYear();
            const multiplier = Math.pow(1 + ratePct / 100, yearsDiff);
            const futureValue = usdVal * multiplier;

            if (!isFinite(futureValue) || futureValue >= 1e303) {
                document.getElementById('result').textContent = `At ${displayRate}% annual returns: $${fmtBig(usdVal)} will be worth > $1 centillion in ${year}`;
                return;
            }

            animate(usdVal, futureValue, document.getElementById('result'), usdVal, year);
        };
    </script>
</body>
</html>
