<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTV Payment Calculator</title>
    <link rel="icon" type="image/png" href="/-/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/-/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/-/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/-/favicon-files/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh; background: #000; color: #fff;
            font-family: system-ui, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
        }
        .content {
            width: 100%; max-width: 360px;
            margin-block: auto; padding: 0 1rem 2rem;
        }
        .converter {
            display: flex; flex-direction: column;
            gap: 12px; width: 100%;
        }
        .input-container {
            position: relative;
        }
        input {
            width: 100%;
            background: #000; color: #fff;
            border: 1px solid #555;
            border-radius: 10px;
            font-size: 24px;
            padding: 20px 32px 20px 32px;
        }
        input[readonly] {
            background: #000;
            border-color: #555;
            color: #fff;
        }
        .ltv-input input { padding-right: 62px; padding-left: 32px; }
        .collateral input { padding-right: 100px; padding-left: 32px; }
        .result-input input { padding-left: 32px; padding-right: 160px; }
        input:hover { background: #111; }
        input:focus { outline: none; }
        .prefix {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%);
            font-size: 24px; pointer-events: none;
            opacity: 1;
        }
        .suffix {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%);
            font-size: 20px; pointer-events: none;
            color: #aaa; opacity: 0; transition: opacity 0.2s;
            padding-left: 12px;
        }
        .filled .suffix { opacity: 1; }
        .menu {
            font-size: 3rem;
            font-weight: 100;
            color: #666;
            margin-block-end: 2vh;
            text-decoration: none;
            transition: color 0.5s ease;
        }
        .menu:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="content">
        <div class="converter">
            <div class="input-container ltv-input">
                <input type="tel" inputmode="decimal" id="ltvPercent" placeholder="LTV %">
                <span class="suffix">LTV</span>
            </div>
            <div class="input-container collateral">
                <span class="prefix">₿</span>
                <input type="tel" inputmode="decimal" id="collateralBtc" placeholder="Collateral">
                <span class="suffix">collateral</span>
            </div>
            <div class="input-container result-input" id="resultContainer">
                <span class="prefix">$</span>
                <input type="text" id="resultField" readonly placeholder="to 15% LTV">
                <span class="suffix">to 15% LTV</span>
            </div>
        </div>
    </div>
    <a data-open-drawer class="menu">≡</a>
    <script>
        const ltvIn = document.getElementById('ltvPercent');
        const collateralIn = document.getElementById('collateralBtc');
        const resultField = document.getElementById('resultField');
        const resultContainer = document.getElementById('resultContainer');
        let currentBtcPrice = 105000;
        async function loadCurrentCSV() {
            try {
                const res = await fetch('/-/data/bitcoin-current-data.csv?t=' + Date.now());
                const text = await res.text();
                const lines = text.split('\n').filter(l => l.trim());
                if (lines.length > 0) {
                    const price = parseFloat(lines[0].split(',')[1].trim());
                    if (!isNaN(price) && price > 0) {
                        currentBtcPrice = price;
                        calculate();
                    }
                }
            } catch (e) {}
        }
        function format(num, decimals = 0) {
            return num.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
        }
        function calculate() {
            const ltv = parseFloat(ltvIn.value.replace(/,/g, '')) || 0;
            const collateralBtc = parseFloat(collateralIn.value.replace(/,/g, '')) || 0;
         
            if (ltv > 0 && collateralBtc > 0) {
                const collateralValue = collateralBtc * currentBtcPrice;
                const loan = collateralValue * (ltv / 100);
                const targetLoan = collateralValue * 0.15;
                const repayAmount = Math.max(0, loan - targetLoan);
             
                resultField.value = repayAmount > 0 ? format(repayAmount) : "0";
                resultContainer.classList.add('filled');
            } else {
                resultField.value = '';
                resultContainer.classList.remove('filled');
            }
        }
        function formatInput(el, parent) {
            el.addEventListener('input', () => {
                let v = el.value.replace(/[^0-9.]/g, '');
             
                if (el === ltvIn) {
                    if (v.includes('.')) {
                        const parts = v.split('.');
                        parts[0] = parts[0].slice(0, 2);
                        if (parts[1]) parts[1] = parts[1].slice(0, 2);
                        v = parts.join('.');
                    } else {
                        v = v.slice(0, 2);
                    }
                }
             
                const [int, dec] = v.split('.');
                const formatted = int ? Number(int).toLocaleString('en-US') : '';
                el.value = dec !== undefined ? `${formatted}.${dec}` : formatted;
                const isFilled = el.value.trim() !== '';
                parent.classList.toggle('filled', isFilled);
                calculate();
            });
        }
        formatInput(ltvIn, ltvIn.parentElement);
        formatInput(collateralIn, collateralIn.parentElement);
     
        setTimeout(() => {
            loadCurrentCSV();
        }, 50);
        setInterval(loadCurrentCSV, 5 * 60 * 1000);
    </script>
    <script src="/menu/drawer.js"></script>
</body>
</html>
