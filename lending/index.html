<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lending</title>
    <meta name="description" content="Model a Bitcoin-backed line of credit: drawn amount, collateral, and LTV.">
    <link rel="canonical" href="https://pricetools.space/lending">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Lending">
    <meta property="og:description" content="Model a Bitcoin-backed line of credit: drawn amount, collateral, and LTV.">
    <meta property="og:url" content="https://pricetools.space/lending">
    <meta property="og:image" content="https://pricetools.space/assets/images/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Lending">
    <meta name="twitter:description" content="Model a Bitcoin-backed line of credit: drawn amount, collateral, and LTV.">
    <meta name="twitter:image" content="https://pricetools.space/assets/images/preview.png">
    <link rel="icon" type="image/png" href="/assets/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon-files/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh; background: #000; color: #fff;
            font-family: system-ui, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
        }
        .content {
            width: 100%; max-width: 360px;
            margin-block: auto; padding: 0 1rem 2rem;
        }
        .converter {
            display: flex; flex-direction: column;
            gap: 12px; width: 100%;
        }
        .input-container {
            position: relative;
        }
        input {
            width: 100%;
            background: #000; color: #fff;
            border: 1px solid #555;
            border-radius: 10px;
            font-size: 24px;
            padding: 20px 32px 20px 32px;
        }
        .btc-price input { padding-right: 114px; }
        .loan-amount input { padding-right: 62px; }
        .collateral input { padding-right: 100px; }
        input:hover, input:focus { background: #111; outline: none; }
        .prefix {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%);
            font-size: 24px; pointer-events: none;
        }
        .suffix {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%);
            font-size: 20px; pointer-events: none;
            color: #aaa; opacity: 0; transition: opacity 0.2s;
            padding-left: 12px;
        }
        .btc-price .suffix { opacity: 1; }
        .filled .suffix { opacity: 1; }
        .result-wrapper {
            width: 100%; min-height: 140px; margin-top: 24px;
            text-align: left; font-size: 18px;
            line-height: 1.4; color: #fff;
        }
        .result-wrapper strong {
            color: #fff; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="converter">
            <div class="input-container btc-price">
                <span class="prefix">$</span>
                <input type="tel" inputmode="decimal" id="btcPrice" placeholder="">
                <span class="suffix">per bitcoin</span>
            </div>
            <div class="input-container loan-amount">
                <span class="prefix">$</span>
                <input type="tel" inputmode="decimal" id="loanAmount" placeholder="Drawn Amount">
                <span class="suffix">loan</span>
            </div>
            <div class="input-container collateral">
                <span class="prefix">₿</span>
                <input type="tel" inputmode="decimal" id="collateralBtc" placeholder="Collateral">
                <span class="suffix">collateral</span>
            </div>
            <div class="result-wrapper" id="results"></div>
        </div>
    </div>
    <script>
        const loanAmountIn = document.getElementById('loanAmount');
        const collateralIn = document.getElementById('collateralBtc');
        const priceIn = document.getElementById('btcPrice');
        const results = document.getElementById('results');
        let currentBtcPrice = 0;
        async function loadCurrentCSV() {
            try {
                const res = await fetch('/assets/data/bitcoin-current-data.csv?t=' + Date.now());
                const text = await res.text();
                const lines = text.split('\n').filter(l => l.trim());
                if (lines.length > 0) {
                    const price = parseFloat(lines[0].split(',')[1].trim());
                    if (!isNaN(price) && price > 0) {
                        currentBtcPrice = price;
                        if (!priceIn.value) {
                            priceIn.placeholder = new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(price);
                            priceIn.parentElement.classList.add('filled');
                        }
                        calculate();
                    }
                }
            } catch (e) {}
        }
        function format(num, decimals = 0) {
            return num.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
        }
        function formatPercent(pct) {
            const rounded = Math.round(pct * 10) / 10;
            let str = rounded.toFixed(1);
            if (str.endsWith('.0')) str = str.slice(0, -2);
            return str;
        }
        function calculate() {
            const loan = parseFloat(loanAmountIn.value.replace(/,/g, '')) || 0;
            const collateralBtc = parseFloat(collateralIn.value.replace(/,/g, '')) || 0;
            let price = parseFloat(priceIn.value.replace(/,/g, '')) || currentBtcPrice;
            if (loan > 0 && collateralBtc > 0 && price > 0) {
                const collateralValue = collateralBtc * price;
                const ltv = (loan / collateralValue) * 100;
                const liqPrice = loan / (collateralBtc * 0.85);
                let dropPercent = ((price - liqPrice) / price) * 100;
                let dropStr = formatPercent(Math.abs(dropPercent));
                const liqDisplay = liqPrice < price
                    ? `$${format(liqPrice)} (-${dropStr}%)`
                    : `$${format(liqPrice)}`;
                const targetLoan = collateralValue * 0.15;
                const repayAmount = Math.max(0, loan - targetLoan);
                let paymentHTML = repayAmount > 0 ? `$${format(repayAmount)}` : `just stack sats`;
                results.innerHTML = `
                    <strong>Loan to value:</strong> ${formatPercent(ltv)}%<br>
                    <strong>Collateral value:</strong> $${format(collateralValue)}<br>
                    <strong>Liquidation price:</strong> ${liqDisplay}<br>
                    <strong>Payment to 15% LTV:</strong> ${paymentHTML}
                `;
            } else {
                results.innerHTML = '';
            }
        }
        function formatInput(el, parent) {
            el.addEventListener('input', () => {
                let v = el.value.replace(/[^0-9.]/g, '');
                if (v.includes('.')) {
                    const parts = v.split('.');
                    if (parts[1]) parts[1] = parts[1].slice(0,8);
                    v = parts.join('.');
                }
                const [int, dec] = v.split('.');
                const formatted = int ? Number(int).toLocaleString('en-US') : '';
                el.value = dec !== undefined ? `${formatted}.${dec}` : formatted;
                const isFilled = el.value.trim() !== '';
                parent.classList.toggle('filled', isFilled);
                if (!isFilled && el === priceIn) {
                    priceIn.placeholder = new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(currentBtcPrice);
                }
                calculate();
            });
        }
        formatInput(loanAmountIn, loanAmountIn.parentElement);
        formatInput(collateralIn, collateralIn.parentElement);
        formatInput(priceIn, priceIn.parentElement);
        setTimeout(() => {
            loadCurrentCSV();
        }, 50);
        setInterval(loadCurrentCSV, 5 * 60 * 1000);
    </script>
    <script src="/menu/menu.js"></script>
</body>
</html>
