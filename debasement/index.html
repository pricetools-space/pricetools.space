<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debasement Calculator</title>
    <meta name="description" content="See how dollar purchasing power erodes over time at a 6.8% annual rate, based on M2 money-supply growth.">
    <link rel="canonical" href="https://pricetools.space/debasement">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Debasement Calculator">
    <meta property="og:description" content="See how dollar purchasing power erodes over time at a 6.8% annual rate, based on M2 money-supply growth.">
    <meta property="og:url" content="https://pricetools.space/debasement">
    <meta property="og:image" content="https://pricetools.space/assets/images/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Debasement Calculator">
    <meta name="twitter:description" content="See how dollar purchasing power erodes over time at a 6.8% annual rate, based on M2 money-supply growth.">
    <meta name="twitter:image" content="https://pricetools.space/assets/images/preview.png">
    <link rel="icon" type="image/png" href="/assets/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon-files/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            background: #000;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .content {
            width: 100%;
            max-width: 360px;
            margin-block: auto;
            padding: 0 1rem;
            text-align: center;
        }
        .converter {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .date-container {
            display: flex;
            gap: 5px;
            width: 100%;
        }
        .date-container select {
            flex: 1;
            text-align: center;
            text-align-last: center;
        }
        .input-container {
            position: relative;
            width: 100%;
        }
        select,
        input {
            width: 100%;
            background: #000;
            color: #fff;
            border: 1px solid #555;
            border-radius: 10px;
            font-size: 24px;
            padding: 20px 12px;
            -webkit-appearance: none;
            appearance: none;
        }
        .now-usd-container input,
        .then-usd-container input {
            padding-left: 32px;
            padding-right: 92px;
        }
        select:hover, select:focus,
        input:hover, input:focus {
            background: #111;
            outline: none;
        }
        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }
        .then-usd-container::before,
        .now-usd-container::before {
            content: '$';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
        }
        .then-usd-container::after,
        .now-usd-container::after {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
        }
        .now-usd-container.filled::after {
            content: 'Today';
            opacity: 1;
        }
        .then-usd-container.filled::after {
            content: attr(data-year);
            opacity: 1;
        }
        select:invalid { color: #666; }
    </style>
</head>
<body>
    <div class="content">
        <div class="converter">
            <div class="date-container">
                <select id="year" required>
                    <option value="" disabled selected hidden>Select A Year</option>
                </select>
            </div>
            <div class="input-container then-usd-container">
                <input type="tel" inputmode="decimal" id="then-usd" placeholder="Then">
            </div>
            <div class="input-container now-usd-container">
                <input type="tel" inputmode="decimal" id="now-usd" placeholder="Now">
            </div>
        </div>
    </div>
    <script src="/menu/menu.js"></script>
    <script>
        const growthRate = 0.068;
        let lastInput = null;
        function getMultiplier(y) {
            const currentYear = new Date().getFullYear();
            const years = currentYear - y;
            return Math.pow(1 + growthRate, years);
        }
        function populateYearSelector() {
            const yearEl = document.getElementById('year');
            const thisYear = new Date().getFullYear();
            for (let y = 1971; y <= thisYear; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                yearEl.appendChild(opt);
            }
        }
        function restrictInput(el, maxDecimals = 2) {
            el.addEventListener('input', () => {
                let v = el.value.replace(/[^0-9.]/g, '');
                if (v.includes('.') && maxDecimals > 0) {
                    const [int, dec] = v.split('.');
                    if (dec && dec.length > maxDecimals) v = int + '.' + dec.slice(0, maxDecimals);
                } else if (maxDecimals === 0) {
                    v = v.replace(/\./g, '');
                }
                const [intPart, decPart] = v.split('.');
                const formatted = intPart ? Number(intPart).toLocaleString('en-US') : '';
                el.value = decPart !== undefined ? `${formatted}.${decPart}` : formatted;
            });
        }
        const thenIn = document.getElementById('then-usd');
        const nowIn = document.getElementById('now-usd');
        const thenContainer = thenIn.parentElement;
        const nowContainer = nowIn.parentElement;
        restrictInput(thenIn, 2);
        restrictInput(nowIn, 2);
        function updateThenSuffix() {
            const y = document.getElementById('year').value;
            if (y) {
                thenContainer.setAttribute('data-year', y);
            } else {
                thenContainer.removeAttribute('data-year');
            }
        }
        thenIn.addEventListener('input', () => {
            thenContainer.classList.toggle('filled', thenIn.value.length > 0);
        });
        nowIn.addEventListener('input', () => {
            nowContainer.classList.toggle('filled', nowIn.value.length > 0);
        });
        async function updateConversions() {
            const y = parseInt(document.getElementById('year').value);
            if (isNaN(y)) {
                nowIn.value = '';
                thenIn.value = '';
                thenContainer.classList.remove('filled');
                nowContainer.classList.remove('filled');
                return;
            }
            const multiplier = getMultiplier(y);
            const active = document.activeElement;
            const isDateChange = active && active.id === 'year';
            const thenVal = parseFloat(thenIn.value.replace(/,/g, '')) || 0;
            const nowVal = parseFloat(nowIn.value.replace(/,/g, '')) || 0;
            if (isDateChange && lastInput) {
                if (lastInput === 'then' && thenVal > 0) {
                    const now = thenVal * multiplier;
                    nowIn.value = now.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    nowContainer.classList.add('filled');
                } else if (lastInput === 'now' && nowVal > 0) {
                    const then = nowVal / multiplier;
                    thenIn.value = then.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    thenContainer.classList.add('filled');
                }
                return;
            }
            if (active === thenIn || !active.closest('.input-container')) {
                if (thenVal > 0) {
                    const now = thenVal * multiplier;
                    nowIn.value = now.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    nowContainer.classList.add('filled');
                } else {
                    nowIn.value = '';
                    nowContainer.classList.remove('filled');
                }
            } else if (active === nowIn) {
                if (nowVal > 0) {
                    const then = nowVal / multiplier;
                    thenIn.value = then.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    thenContainer.classList.add('filled');
                } else {
                    thenIn.value = '';
                    thenContainer.classList.remove('filled');
                }
            }
        }
        thenIn.addEventListener('input', () => { lastInput = 'then'; setTimeout(updateConversions, 0); });
        nowIn.addEventListener('input', () => { lastInput = 'now'; setTimeout(updateConversions, 0); });
        document.getElementById('year').addEventListener('change', () => {
            updateThenSuffix();
            setTimeout(updateConversions, 0);
        });
        populateYearSelector();
        updateThenSuffix();
    </script>
</body>
</html>
