<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD to BTC</title>
    <!-- SEO -->
    <meta name="description" content="Free Bitcoin price tools: historical data, USD to BTC converter, and price projections.">
    <meta name="keywords" content="bitcoin price, btc usd converter, bitcoin history, bitcoin prediction, bitcoin tools">
    <!-- Open Graph -->
    <meta property="og:title" content="Price Tools - Bitcoin Price History, Converter & Projections">
    <meta property="og:description" content="Instant Bitcoin price tools: view history, convert USD to BTC, and see projections.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pricetools.space">
    <meta property="og:image" content="/-/images/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Price Tools - Bitcoin Price History, Converter & Projections">
    <meta name="twitter:description" content="Instant Bitcoin price tools: view history, convert USD to BTC, and see projections.">
    <meta name="twitter:image" content="/-/images/preview.png">
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/-/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/-/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/-/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/-/favicon-files/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            background: #000;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .content {
            width: 100%;
            max-width: 360px;
            margin-block: auto;
            padding: 0 1rem;
            text-align: center;
        }
        h1 { font-size: 32px; margin-bottom: 24px; }
        .converter { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .input-container { position: relative; width: 100%; }
        input {
            width: 100%;
            background: #000;
            color: #fff;
            border: 1px solid #555;
            border-radius: 10px;
            font-size: 24px;
            padding: 20px 12px;
            -webkit-appearance: none;
            appearance: none;
        }
        .usd-container input,
        .btc-container input,
        .sats-container input { padding-left: 32px; }
        .sats-container input { padding-right: 72px; }
        input:hover,
        input:focus { background: #111; outline: none; }
        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button { -webkit-appearance: none; }
        .usd-container::before { content: '$'; }
        .btc-container::before { content: '₿'; }
        .usd-container::before,
        .btc-container::before {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
        }
        .sats-container::before, .sats-cost::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 51%;
            transform: translateY(-50%);
            width: 1.2em;
            height: 1.2em;
            background: url('/-/images/sats.svg') center/contain no-repeat;
            pointer-events: none;
        }
        .sats-container::after {
            content: 'sats';
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            opacity: 0;
            transition: opacity .2s;
        }
        .sats-container.filled::after { opacity: 1; }
        .menu {
            font-size: 3rem;
            font-weight: 100;
            color: #666;
            margin-block-end: 2vh;
            text-decoration: none;
            transition: color 0.5s ease;
        }
        .menu:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="content">
        <div class="converter">
            <div class="input-container usd-container">
                <input type="tel" inputmode="decimal" id="usd" placeholder="USD">
            </div>
            <div class="input-container btc-container">
                <input type="tel" inputmode="decimal" id="btc" placeholder="BTC">
            </div>
            <div class="input-container sats-container">
                <input type="tel" inputmode="numeric" id="sats" placeholder="SATS">
            </div>
        </div>
    </div>
    <a data-open-drawer class="menu">≡</a>
    <script src="/menu/drawer.js"></script>
    <script>
        const btcToSats = 100000000;
        let currentRate = null;
        let lastModifiedField = null; // tracks which field the user last typed in

        async function loadCurrentCSV() {
            try {
                const res = await fetch('/-/data/bitcoin-current-data.csv?t=' + Date.now());
                const text = await res.text();
                const lines = text.split('\n').filter(l => l.trim());
                if (lines.length > 0) {
                    const price = parseFloat(lines[0].split(',')[1].trim());
                    if (!isNaN(price) && price > 0) currentRate = 1 / price;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function restrictInput(el, maxDecimals = 8) {
            el.addEventListener('input', () => {
                let v = el.value.replace(/[^0-9.]/g, '');
                if (v.includes('.') && maxDecimals > 0) {
                    const [int, dec] = v.split('.');
                    if (dec && dec.length > maxDecimals) v = int + '.' + dec.slice(0, maxDecimals);
                } else if (maxDecimals === 0) {
                    v = v.replace(/\./g, '');
                }
                const [intPart, decPart] = v.split('.');
                const formatted = intPart ? Number(intPart).toLocaleString('en-US') : '';
                el.value = decPart !== undefined ? `${formatted}.${decPart}` : formatted;
            });
        }

        const usdIn = document.getElementById('usd');
        const btcIn = document.getElementById('btc');
        const satsIn = document.getElementById('sats');
        const satsContainer = satsIn.parentElement;

        restrictInput(usdIn, 2);
        restrictInput(btcIn, 8);
        restrictInput(satsIn, 0);

        satsIn.addEventListener('input', () => {
            satsContainer.classList.toggle('filled', satsIn.value.length > 0);
        });

        // remember which field the user last edited
        usdIn.addEventListener('input', () => { lastModifiedField = usdIn; setTimeout(updateConversions, 0); });
        btcIn.addEventListener('input', () => { lastModifiedField = btcIn; setTimeout(updateConversions, 0); });
        satsIn.addEventListener('input', () => { lastModifiedField = satsIn; setTimeout(updateConversions, 0); });

        function updateConversions(fromBackgroundRefresh = false) {
            if (currentRate === null) return;

            // On background refresh, only recalculate from the last user-modified field
            if (fromBackgroundRefresh && lastModifiedField) {
                const val = parseFloat(lastModifiedField.value.replace(/,/g, '')) || 0;
                const isSats = lastModifiedField === satsIn;
                const isBtc = lastModifiedField === btcIn;

                if (isSats && val > 0) {
                    const btc = val / btcToSats;
                    usdIn.value = Number(btc / currentRate).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    btcIn.value = btc.toFixed(8).replace(/0+$/, '').replace(/\.$/, '');
                    satsContainer.classList.add('filled');
                } else if (isBtc && val > 0) {
                    usdIn.value = Number(val / currentRate).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    satsIn.value = Math.floor(val * btcToSats).toLocaleString('en-US');
                    satsContainer.classList.add('filled');
                } else if (val > 0) { // USD field
                    const btc = val * currentRate;
                    btcIn.value = btc.toFixed(8).replace(/0+$/, '').replace(/\.$/, '');
                    satsIn.value = Math.floor(btc * btcToSats).toLocaleString('en-US');
                    satsContainer.classList.add('filled');
                }
                return;
            }

            // Normal interactive behaviour (same as before)
            const active = document.activeElement;
            const usdVal = parseFloat(usdIn.value.replace(/,/g, '')) || 0;
            const btcVal = parseFloat(btcIn.value.replace(/,/g, '')) || 0;
            const satsVal = BigInt(satsIn.value.replace(/,/g, '') || '0');

            if (active === usdIn || !active.closest('.input-container')) {
                if (usdVal > 0) {
                    const btc = usdVal * currentRate;
                    btcIn.value = btc.toFixed(8).replace(/0+$/, '').replace(/\.$/, '');
                    satsIn.value = Math.floor(btc * btcToSats).toLocaleString('en-US');
                    satsContainer.classList.add('filled');
                } else {
                    btcIn.value = '';
                    satsIn.value = '';
                    satsContainer.classList.remove('filled');
                }
            } else if (active === btcIn) {
                if (btcVal > 0) {
                    usdIn.value = Number(btcVal / currentRate).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    satsIn.value = Math.floor(btcVal * btcToSats).toLocaleString('en-US');
                    satsContainer.classList.add('filled');
                } else {
                    usdIn.value = '';
                    satsIn.value = '';
                    satsContainer.classList.remove('filled');
                }
            } else if (active === satsIn) {
                if (satsVal > 0n) {
                    const btc = Number(satsVal) / btcToSats;
                    usdIn.value = Number(btc / currentRate).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    btcIn.value = btc.toFixed(8).replace(/0+$/, '').replace(/\.$/, '');
                    satsContainer.classList.add('filled');
                } else {
                    usdIn.value = '';
                    btcIn.value = '';
                    satsContainer.classList.remove('filled');
                }
            }
        }

        async function refreshRate() {
            await loadCurrentCSV();
            updateConversions(true); // true = background refresh → use lastModifiedField as source
        }

        loadCurrentCSV().then(() => updateConversions());
        setInterval(refreshRate, 5 * 60 * 1000);
    </script>
</body>
</html>
