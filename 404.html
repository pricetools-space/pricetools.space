<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <meta name="description" content="The page you're looking for doesn't exist.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="/assets/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon-files/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            background: #000;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 360px;
            margin-block: auto;
            padding: 0 1rem;
        }
        h1 {
            font-size: 128px;
            font-weight: bold;
            margin-bottom: 16px;
            text-align: center;
        }
        p {
            font-size: 24px;
            margin-bottom: 32px;
            text-align: center;
        }
        .home-link {
            display: inline-block;
            color: inherit;
            text-decoration: none;
        }
        .home-link h1 {
            transition: opacity 0.3s ease;
        }
        .home-link:hover h1 {
            opacity: 0.55;
        }
    </style>
</head>
<body>
    <div class="content">
        <a href="/" class="home-link" aria-label="Back to home"><h1>404</h1></a>
        <p>Page Not Found</p>
    </div>
    <script src="/menu/menu.js"></script>
</body>
</html>
