<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>404 - Page Not Found</title>
    <link rel="icon" type="image/png" href="/-/favicon-files/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/-/favicon-files/favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/-/favicon-files/apple-touch-icon.png">
    <link rel="manifest" href="/-/favicon-files/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            background: #000;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 360px;
            margin-block: auto;
            padding: 0 1rem;
        }
        h1 {
            font-size: 128px;
            font-weight: bold;
            margin-bottom: 16px;
            text-align: center;
        }
        p {
            font-size: 24px;
            margin-bottom: 32px;
            text-align: center;
        }
        .buttons {
            display: flex;
            gap: 21px;
            margin-bottom: 32px;
            justify-content: center;
        }
        .buttons a {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: none;
            opacity: 0;
            animation: fadeIn 0.6s ease-out forwards;
            text-decoration: none;
        }
        .buttons a:nth-child(1) { animation-delay: 0.1s; }
        .buttons a:nth-child(2) { animation-delay: 0.2s; }
        .buttons a:nth-child(3) { animation-delay: 0.3s; }
        .buttons a:hover img {
            transform: scale(1.1);
            transition: transform 0.2s;
        }
        .buttons img {
            width: 83px;
            height: auto;
            margin-bottom: 16px;
        }
        .buttons .text {
            font-size: 14px;
            color: #aaa;
            font-weight: bold;
            transition: color 0.2s;
            text-decoration: none;
        }
        .buttons a:hover .text {
            color: #fff;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .menu {
            font-size: 3rem;
            font-weight: 10;
            color: #666;
            margin-block-end: 2vh;
            text-decoration: none;
            transition: color 0.5s ease;
        }
        .menu:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="content">
        <h1>404</h1>
        <p>Page Not Found</p>
        <div class="buttons">
            <a href="/past" aria-label="Past Price Tool">
                <img src="/-/images/r.svg" alt="">
                <span class="text">Past</span>
            </a>
            <a href="/usd-to-btc" aria-label="USD to BTC Converter">
                <img src="/-/images/cal.svg" alt="">
                <span class="text">USD to BTC</span>
            </a>
            <a href="/future" aria-label="Future Price Tool">
                <img src="/-/images/ff.svg" alt="">
                <span class="text">Future</span>
            </a>
        </div>
    </div>
    <a data-open-drawer class="menu">≡</a>
    <script src="/menu/drawer.js"></script>
</body>
</html>
